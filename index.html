/* ============================================================
   SYNC ENTRE COMPUTADORES (GitHub Gist secreto)
   O estado inteiro vive num arquivo JSON dentro de um Gist. Cada máquina
   guarda token+id só no próprio localStorage (fora do estado — não entram
   no backup nem no Gist).

   MODELO: UNIÃO (merge), não "o mais recente vence".
   A versão antiga substituía o estado inteiro pelo lado com updatedAt maior —
   qualquer sessão registrada na outra máquina (ou na cópia local aberta em
   file://, que tem localStorage próprio) era apagada em silêncio. Agora:
     · sessões são unidas por uid, com tombstone para exclusões reais;
     · topicStatus e revFeitas resolvem conflito item a item;
     · todo envio é read-modify-write (busca → funde → grava).
   Consequência prática: um dado sobrevive enquanto QUALQUER máquina ainda o
   tiver — basta abrir o dashboard nela para ele voltar ao Gist.
   ============================================================ */
const SYNC_LS={token:"estudosSEFAZAL_syncToken",gist:"estudosSEFAZAL_syncGist"};
const SYNC_FILE="estudos-tcepe.json";
const SYNC_POLL_MS=90000; // relê a nuvem periodicamente
let syncTimer=null, syncPollTimer=null, syncEmVoo=false, syncEstado="off"; // off|ok|pendente|sincronizando|erro

function syncCfg(){ return {token:localStorage.getItem(SYNC_LS.token)||"", gist:localStorage.getItem(SYNC_LS.gist)||""}; }
function syncSetStatus(s,msg){
  syncEstado=s; const el=document.getElementById("syncStatus"); if(!el) return;
  const map={off:"",ok:"☁ sincronizado",pendente:"☁ alterações pendentes…",sincronizando:"☁ sincronizando…",erro:"☁ ⚠ "+(msg||"erro")};
  el.textContent=map[s]||""; el.style.color = s==="erro" ? "var(--bad)" : "";
}
async function syncApi(method,path,body,token){
  const r=await fetch("https://api.github.com"+path,{method,
    headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error("GitHub "+r.status);
  return r.json();
}

/* ---------- MERGE ----------
   Devolve {estado, mudouLocal, mudouRemoto} — quem ganhou item por item. */
const ST_RANK={nao:0,estudando:1,revisar:2,concluido:3};
function mergeState(local, remoto){
  const out = Object.assign(defaultState(), JSON.parse(JSON.stringify(local)));
  let mudouLocal=false, mudouRemoto=false;
  const R = remoto||{};

  // -- tombstones: união (uma exclusão feita em qualquer máquina vale) --
  const del = Object.assign({}, R.sessionsDel||{}, out.sessionsDel||{});
  if(Object.keys(del).length!==Object.keys(out.sessionsDel||{}).length) mudouLocal=true;
  if(Object.keys(del).length!==Object.keys(R.sessionsDel||{}).length) mudouRemoto=true;
  out.sessionsDel = del;

  // -- sessões: união por uid, menos as apagadas --
  const porUid={};
  (out.sessions||[]).forEach(s=>{ if(s&&s.uid) porUid[s.uid]=s; });
  const antesLocal = Object.keys(porUid).length;
  (R.sessions||[]).forEach(s=>{
    if(!s) return;
    const uid = s.uid || uidLegado(s);
    s.uid = uid;
    if(!porUid[uid]) porUid[uid]=s;
  });
  Object.keys(porUid).forEach(u=>{ if(del[u]) delete porUid[u]; });
  const remotoUids = new Set((R.sessions||[]).map(s=>s&&(s.uid||uidLegado(s))).filter(Boolean));
  Object.keys(porUid).forEach(u=>{ if(!remotoUids.has(u)) mudouRemoto=true; });
  if(Object.keys(porUid).length!==antesLocal) mudouLocal=true;
  out.sessions = Object.values(porUid).sort((a,b)=> String(a.data).localeCompare(String(b.data)) || String(a.uid).localeCompare(String(b.uid)));

  // -- topicStatus: vence o carimbo mais novo; sem carimbo, o status mais avançado --
  const stAt = Object.assign({}, out.topicStatusAt||{});
  Object.keys(R.topicStatus||{}).forEach(k=>{
    const rv=R.topicStatus[k], lv=out.topicStatus[k];
    const ra=(R.topicStatusAt||{})[k]||"", la=stAt[k]||"";
    if(lv===undefined){ out.topicStatus[k]=rv; if(ra)stAt[k]=ra; mudouLocal=true; return; }
    if(rv===lv){ if(ra&&ra>la) stAt[k]=ra; return; }
    const remotoVence = (ra||la) ? (ra>la) : ((ST_RANK[rv]||0)>(ST_RANK[lv]||0));
    if(remotoVence){ out.topicStatus[k]=rv; if(ra)stAt[k]=ra; mudouLocal=true; }
    else mudouRemoto=true;
  });
  Object.keys(out.topicStatus).forEach(k=>{ if(!(k in (R.topicStatus||{}))) mudouRemoto=true; });
  out.topicStatusAt = stAt;

  // -- revFeitas: união; conflito → revisão realmente FEITA vence "pulada"/"expirada",
  //    e entre duas datas fica a mais antiga (a que de fato marcou a conclusão) --
  const rvAt = Object.assign({}, out.revFeitasAt||{});
  const concreta = v => v && v!=="pulada" && v!=="expirada";
  Object.keys(R.revFeitas||{}).forEach(k=>{
    const rv=R.revFeitas[k], lv=out.revFeitas[k];
    if(lv===undefined){ out.revFeitas[k]=rv; const ra=(R.revFeitasAt||{})[k]; if(ra)rvAt[k]=ra; mudouLocal=true; return; }
    if(rv===lv) return;
    let vencedor;
    if(concreta(rv)&&!concreta(lv)) vencedor=rv;
    else if(concreta(lv)&&!concreta(rv)) vencedor=lv;
    else vencedor = (String(rv)<String(lv)) ? rv : lv;
    if(vencedor!==lv){ out.revFeitas[k]=vencedor; mudouLocal=true; } else mudouRemoto=true;
  });
  Object.keys(out.revFeitas).forEach(k=>{ if(!(k in (R.revFeitas||{}))) mudouRemoto=true; });
  out.revFeitasAt = rvAt;

  /* -- backlog de tempo livre: união por id.
        `sobraFeitas` guarda a ÚLTIMA data em que o item foi feito → vence a mais recente
        (item recorrente feito nas duas máquinas tem de mostrar a atividade mais nova).
        `sobraN` é contador → vence o maior. Sem este bloco o mergeState descartaria em
        silêncio o que a outra máquina fez, porque tudo que ele não trata explicitamente
        vem do estado LOCAL (`Object.assign(defaultState(), local)`). -- */
  Object.keys(R.sobraFeitas||{}).forEach(k=>{
    const rv=R.sobraFeitas[k], lv=out.sobraFeitas[k];
    if(lv===undefined || String(rv)>String(lv)){ out.sobraFeitas[k]=rv; mudouLocal=true; }
    else if(String(rv)<String(lv)) mudouRemoto=true;
  });
  Object.keys(out.sobraFeitas).forEach(k=>{ if(!(k in (R.sobraFeitas||{}))) mudouRemoto=true; });
  Object.keys(R.sobraN||{}).forEach(k=>{
    const rv=R.sobraN[k]||0, lv=out.sobraN[k]||0;
    if(rv>lv){ out.sobraN[k]=rv; mudouLocal=true; } else if(rv<lv) mudouRemoto=true;
  });
  Object.keys(out.sobraN).forEach(k=>{ if(!(k in (R.sobraN||{}))) mudouRemoto=true; });

  // -- assuntos personalizados: união por id --
  const ct={}; (out.customTopics||[]).forEach(t=>{ if(t&&t.id!=null) ct[t.id]=t; });
  const nCt=Object.keys(ct).length;
  (R.customTopics||[]).forEach(t=>{ if(t&&t.id!=null&&!ct[t.id]){ ct[t.id]=t; mudouLocal=true; } });
  if(Object.keys(ct).length!==(R.customTopics||[]).length || nCt!==Object.keys(ct).length) mudouRemoto=true;
  out.customTopics = Object.values(ct);

  out.nextSid = Math.max(out.nextSid||1, R.nextSid||1);
  out.nextTid = Math.max(out.nextTid||1000, R.nextTid||1000);
  out.updatedAt = new Date().toISOString();
  return {estado:out, mudouLocal, mudouRemoto};
}

/* ============================================================
   RECONSTRUÇÃO A PARTIR DO TEC
   As capturas do TEC são a fonte durável do que foi estudado (dia, assunto,
   tempo, acerto). Aqui elas preenchem SÓ as lacunas do histórico:
     · sessão que já existe (mesmo uid) não entra de novo;
     · sessão apagada de propósito não ressuscita (tombstone);
     · lançamento manual no mesmo dia+assunto tem precedência — ele inclui o
       tempo de teoria/leitura, que o TEC não registra.
   Idempotente: rodar de novo não duplica nada.
   ============================================================ */
function absorverSessoesTec(avisar){
  const pacote = window.SESSOES_TEC;
  if(!pacote || !Array.isArray(pacote.sessoes)) return 0;
  const porUid = {}; const ocupado = {};
  (state.sessions||[]).forEach(s=>{
    porUid[s.uid]=1;
    ocupado[s.data+"|"+(s.topicId!=null?String(s.topicId):"livre:"+(s.assuntoLivre||""))]=1;
  });
  let add=0;
  pacote.sessoes.forEach(t=>{
    if(porUid[t.uid] || state.sessionsDel[t.uid]) return;
    const chave = t.data+"|"+(t.topicId!=null?String(t.topicId):"livre:"+(t.assuntoLivre||""));
    if(ocupado[chave]) return;              // já lançada à mão: não mexe
    state.sessions.push(Object.assign({}, t));
    ocupado[chave]=1; porUid[t.uid]=1; add++;
  });
  if(add){
    state.sessions.sort((a,b)=> String(a.data).localeCompare(String(b.data)) || String(a.uid).localeCompare(String(b.uid)));
    save();
    const ab=document.querySelector("#tabs button.active"); const tab=ab?ab.dataset.tab:"dash";
    if(tab==="sessao") renderHoje(); else render(tab);
    if(avisar!==false) toast(add+" sessão(ões) recuperada(s) do histórico do TEC ✓");
  }
  return add;
}
/* Refaz o histórico do TEC ignorando os lançamentos manuais que o encobrem.
   Botão de emergência: use se o histórico manual estiver claramente furado. */
function reconstruirDoTec(){
  const p=window.SESSOES_TEC;
  if(!p||!p.sessoes){ alert("sessoes_tec.js não carregou. Rode 06_Scripts/gerar_sessoes_tec.py e publique o arquivo."); return; }
  if(!confirm("Reconstruir o histórico a partir das "+p.sessoes.length+" sessões do TEC?\n\n"+
     "· Sessões lançadas à mão são MANTIDAS.\n"+
     "· Sessões do TEC ausentes são inseridas, inclusive onde há lançamento manual no mesmo dia/assunto.\n"+
     "· Exclusões que você fez de propósito são reativadas.\n\n"+
     "O estado atual vira snapshot antes (botão ⤺ Snapshots).")) return;
  snapshot("antes de reconstruir do TEC");
  const porUid={}; (state.sessions||[]).forEach(s=>porUid[s.uid]=1);
  let add=0;
  p.sessoes.forEach(t=>{ if(porUid[t.uid]) return;
    delete state.sessionsDel[t.uid];
    state.sessions.push(Object.assign({},t)); add++; });
  state.sessions.sort((a,b)=> String(a.data).localeCompare(String(b.data)) || String(a.uid).localeCompare(String(b.uid)));
  save();
  const ab=document.querySelector("#tabs button.active"); render(ab?ab.dataset.tab:"dash");
  alert(add?(add+" sessão(ões) inserida(s)."):"Nada a inserir — o histórico já cobre todo o TEC.");
}

function lerRemoto(g){
  const f=g.files&&g.files[SYNC_FILE];
  if(!f) return Promise.resolve(null);
  if(f.truncated) return fetch(f.raw_url).then(r=>r.text()).then(t=>{ try{return JSON.parse(t);}catch(_){return null;} });
  try{ return Promise.resolve(JSON.parse(f.content)); }catch(_){ return Promise.resolve(null); }
}
function aplicar(novo, avisar){
  const antes=(state.sessions||[]).length;
  if(novo.sessions.length<antes) snapshot("merge reduziu de "+antes+" p/ "+novo.sessions.length+" sessões");
  state = novo; gravarLocal();
  const ab=document.querySelector("#tabs button.active");
  const tab = ab?ab.dataset.tab:"dash";
  // nunca reconstruir a aba "Sessão de Estudo" por trás do usuário: apagaria o
  // formulário/cronômetro em uso. Ali só o resumo do dia é atualizado.
  if(tab==="sessao") renderHoje(); else render(tab);
  if(avisar) toast(avisar);
}

/* Read-modify-write: sempre busca a nuvem, funde e só então grava.
   É o que impede uma máquina de sobrescrever o trabalho da outra. */
let syncRefazer=false;
async function syncSincronizar(silencioso){
  const c=syncCfg(); if(!c.token||!c.gist) return;
  // já há uma rodada em voo: marca para repetir depois em vez de descartar
  // (descartar era como uma sessão salva durante a sincronização ficava só local)
  if(syncEmVoo){ syncRefazer=true; return; }
  syncEmVoo=true;
  syncSetStatus("sincronizando");
  try{
    const g=await syncApi("GET","/gists/"+c.gist,null,c.token);
    const remoto=await lerRemoto(g);
    let {estado,mudouLocal,mudouRemoto}=mergeState(state,remoto);
    if(mudouLocal) aplicar(estado, silencioso?"":"Dados do outro computador incorporados ☁");
    else { state=estado; gravarLocal(); }
    // só depois de conhecer a nuvem: evita inserir do TEC algo que a outra
    // máquina já tinha lançado à mão e ainda não havia chegado aqui
    if(absorverSessoesTec(!silencioso)) mudouRemoto=true;
    if(mudouRemoto||!remoto){
      await syncApi("PATCH","/gists/"+c.gist,{files:{[SYNC_FILE]:{content:JSON.stringify(state)}}},c.token);
    }
    syncSetStatus("ok");
  }catch(e){ syncSetStatus("erro", String(e.message||e).indexOf("401")>=0 ? "token inválido — clique em ☁ Sync" : "sem conexão; dados salvos localmente"); }
  finally{
    syncEmVoo=false;
    if(syncRefazer){ syncRefazer=false; setTimeout(()=>syncSincronizar(true),400); }
  }
}
const syncPush = ()=>syncSincronizar(true);
const syncPull = ()=>syncSincronizar(false);

function syncAgendar(){ // chamada em todo save(); agrupa gravações em 1 envio
  const c=syncCfg(); if(!c.token||!c.gist) return;
  syncSetStatus("pendente"); clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncSincronizar(true),2500);
}
async function syncSetup(){
  const c=syncCfg();
  const token=(prompt("Token CLÁSSICO do GitHub com escopo 'gist' (Settings → Developer settings → Tokens classic).\nFica salvo só neste navegador.",c.token)||"").trim();
  if(!token){
    if(c.token&&confirm("Desativar a sincronização nesta máquina?")){
      localStorage.removeItem(SYNC_LS.token); localStorage.removeItem(SYNC_LS.gist); syncSetStatus("off");
    }
    return;
  }
  let gist=(prompt("ID do Gist (deixe vazio para CRIAR um Gist secreto novo agora):",c.gist)||"").trim();
  try{
    if(!gist){
      const g=await syncApi("POST","/gists",{description:"Estudos SEFAZ-AL — estado do dashboard",public:false,
        files:{[SYNC_FILE]:{content:JSON.stringify(state)}}},token);
      gist=g.id;
      alert("Gist secreto criado!\n\nID (use-o ao configurar o outro computador):\n"+gist);
    } else {
      await syncApi("GET","/gists/"+gist,null,token); // valida token+id
    }
    localStorage.setItem(SYNC_LS.token,token); localStorage.setItem(SYNC_LS.gist,gist);
    toast("Sync configurada ✓"); syncPull();
  }catch(e){ alert("Não deu certo ("+e.message+").\nConfira se o token tem o escopo Gists e se o ID está correto."); }
}
/* Duas abas/janelas do dashboard na MESMA máquina eram um caminho de perda
   independente da nuvem: a aba antiga guardava um `state` em memória e, ao
   salvar, regravava por cima do que a outra aba tinha acabado de registrar.
   Agora cada aba funde o que a vizinha gravou. */
window.addEventListener("storage", ev=>{
  if(ev.key!==LS_KEY || !ev.newValue) return;
  let outro=null; try{ outro=JSON.parse(ev.newValue); }catch(e){ return; }
  if(!outro||!outro.sessions) return;
  const {estado,mudouLocal}=mergeState(state,migrar(outro));
  if(mudouLocal) aplicar(estado,"");
  else state=estado;
});

syncPull(); // ao abrir: funde com o estado da nuvem (e depois absorve o TEC)
// Sem sync configurada não há nuvem para esperar: absorve o TEC direto.
if(!syncCfg().token) absorverSessoesTec(true);

// Relê a nuvem de tempos em tempos e sempre que a aba volta ao primeiro plano.
// Com merge isso é seguro (nunca substitui, só acrescenta) e evita ficar horas
// com um estado defasado da outra máquina.
syncPollTimer=setInterval(()=>{ if(!document.hidden) syncSincronizar(true); }, SYNC_POLL_MS);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) syncSincronizar(true); });

// Fechar a aba com envio pendente: tenta mandar mesmo assim. Sem merge prévio,
// mas nada se perde de forma definitiva — o que existir só na outra máquina
// volta ao Gist assim que o dashboard for aberto lá.
window.addEventListener("beforeunload",()=>{
  if(syncEstado!=="pendente") return;
  const c=syncCfg(); if(!c.token||!c.gist) return;
  fetch("https://api.github.com/gists/"+c.gist,{method:"PATCH",keepalive:true,
    headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},
    body:JSON.stringify({files:{[SYNC_FILE]:{content:JSON.stringify(state)}}})});
});

/* ============================================================
   BACKUP / RESTORE
   ============================================================ */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="estudos-tcepe-backup-"+todayStr()+".json"; a.click(); toast("Backup gerado");
}
function importData(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result);
    if(!s.sessions||!s.topicStatus) throw 0;
    snapshot("antes de restaurar backup "+f.name);
    state=migrar(Object.assign(defaultState(),s)); save();
    document.querySelector("#tabs button.active")?.click() || render("dash"); render("dash");
    toast("Backup restaurado");
  }catch(e){ alert("Arquivo inválido."); } ev.target.value=""; };
  r.readAsText(f);
}

/* ============================================================
   INIT
   ============================================================ */
render("dash");
// Fila real de revisões (exportada pelo gerar_fila.py junto do estado das cadeias)
fetch("desempenho_assuntos.json",{cache:"no-store"})
  .then(r=>r.ok?r.json():null)
  .then(j=>{ if(!j||!j.resumo) return; DESEMP_TEC=j;
    // Modo saldo líquido: o próprio arquivo declara o formato; arquivos antigos
    // (ciclo FGV) não têm o campo nem os campos de saldo, e ficam no acerto bruto.
    MODO_CE = j.formato==="ce" && j.resumo.saldo_pct_unicas!==undefined;
    const ab=document.querySelector("#tabs button.active");
    if(ab&&(ab.dataset.tab==="assuntos"||ab.dataset.tab==="disciplina")) render(ab.dataset.tab); })
  .catch(()=>{});
</script>
