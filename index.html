<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEFAZ-AL · Auditor Fiscal — Controle de Preparação</title>
<style>
:root{
  --bg:#0f1419; --panel:#1a212b; --panel2:#222c38; --line:#2e3a48;
  --txt:#e6edf3; --muted:#8b9bb0; --accent:#4cc2ff; --accent2:#7c5cff;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --revisar:#d29922;
  --radius:14px; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45}
a{color:var(--accent)}
.app{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header.top{display:flex;align-items:center;gap:14px;padding:18px 0 10px;flex-wrap:wrap}
header.top h1{font-size:20px;margin:0;font-weight:700}
header.top .sub{color:var(--muted);font-size:13px}
header.top .spacer{flex:1}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#06121c;border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:#06121c}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 22px;border-bottom:1px solid var(--line);padding-bottom:0}
nav.tabs button{background:none;border:none;color:var(--muted);padding:11px 16px;cursor:pointer;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button.active{color:var(--txt);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:hover{color:var(--txt)}
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .label{color:var(--muted);font-size:13px;margin-bottom:6px}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.5px}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .foot{color:var(--muted);font-size:12px;margin-top:4px}
h2.sec{font-size:16px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec .pill{font-size:12px;color:var(--muted);font-weight:400}
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.bar-row .name{width:215px;font-size:13.5px;flex-shrink:0}
.bar-row .track{flex:1;background:var(--panel2);height:16px;border-radius:8px;overflow:hidden;position:relative}
.bar-row .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));min-width:2px}
.bar-row .meta{position:absolute;top:0;bottom:0;width:2px;background:#fff6;}
.bar-row .num{width:120px;text-align:right;font-size:12.5px;color:var(--muted);flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:#ffffff06}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.st-nao{background:#2e3a48;color:#a9b6c5}
.st-estudando{background:#19324a;color:#4cc2ff}
.st-revisar{background:#3a2f12;color:#e3b341}
.st-concluido{background:#16331f;color:#56d364}
.prio{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px}
.prio.p1{background:#3a1518;color:#ff8a92}
.prio.p2{background:#3a2f12;color:#e3b341}
.prio.p3{background:#19324a;color:#7fd0ff}
.prio.p4{background:#2e3a48;color:#a9b6c5}
.badge2025{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;background:#16331f;color:#56d364;margin-left:5px}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.fld{display:block;margin-bottom:14px}
label.fld .lab{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.ass-head,.ass-row{display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(170px,1.9fr) 76px 76px 34px;gap:8px;align-items:center;margin-bottom:8px}
.ass-head{margin-bottom:4px;font-size:12px;color:var(--muted)}
.ass-row .btn{padding:6px 0;text-align:center}
.timer-box{text-align:center;padding:8px 0 4px}
.timer{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer.running{color:var(--accent)}
.timer-ctrls{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.sched-day{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.sched-day h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.sched-day h3 .tot{color:var(--muted);font-size:13px;font-weight:400}
.bloco-rot{font-weight:600;color:var(--fg);margin-bottom:4px;line-height:1.35}
.sched-item{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.sched-item:first-of-type{border-top:none}
.sched-item .min{color:var(--accent);font-weight:600;width:58px;flex-shrink:0}
.sched-item .mt{font-weight:600;width:240px;flex-shrink:0}
.sched-item .ds{color:var(--muted);flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sched-day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sched-day.today h3::after{content:"hoje";background:var(--accent);color:#06121c;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:8px}
.topchip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13px;color:var(--text)}
.topchip.c25{border-color:var(--ok)}
.topchip .qn{color:var(--muted);font-size:11.5px}
.cods{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn.xs{padding:2px 7px;font-size:11.5px;border-radius:6px;line-height:1.4}
.cods-ver{color:var(--accent);cursor:pointer;font-size:11.5px;text-decoration:underline;user-select:none}
.cods-list{flex-basis:100%;margin-top:4px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted);word-break:break-all;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;user-select:all}
.bloco-note{font-style:italic}
.crono-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crono-nav .wk{font-size:18px;font-weight:700}
.crono-nav .now-pill{background:var(--ok);color:#06121c;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.crono-nav .ph{color:var(--muted);font-size:13px}
th.wk-now,td.wk-now{background:rgba(76,194,255,.12)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:6px 0 16px}
.legend span{display:flex;align-items:center;gap:6px}
.phase{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:14px 0}
.phase h4{margin:0 0 4px;font-size:14.5px}
.phase p{margin:0;color:var(--muted);font-size:13.5px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{width:auto;min-width:140px}
.mat-group{margin-bottom:8px}
.mat-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none}
.mat-head .mname{font-weight:600;flex:1}
.mat-head .mprog{font-size:12.5px;color:var(--muted)}
.mat-head .mbar{width:90px;height:7px;background:var(--bg);border-radius:5px;overflow:hidden}
.mat-head .mbar i{display:block;height:100%;background:var(--ok)}
.mat-body{padding:4px 0 10px}
.empty{color:var(--muted);text-align:center;padding:30px;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06121c;padding:11px 22px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.hide{display:none!important}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qstat{font-size:12.5px;color:var(--muted)}
/* Chips de semana do plano (aba Assuntos): S = 1a passagem, R = revisita da Fase 3 */
.semchip{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(76,194,255,.14);color:var(--accent);margin-left:4px;cursor:help}
.semchip.mov{background:rgba(227,179,65,.16);color:var(--warn)}
.semchip.rev{background:rgba(255,255,255,.07);color:var(--muted)}
.sem-box{margin-bottom:12px}
.sem-box b.wk{font-size:15px}
.right{text-align:right}
/* Gantt */
.gantt-wrap{overflow-x:auto}
.gantt{--glab:270px;position:relative;min-width:820px}
.g-row{display:flex;align-items:center;min-height:25px}
.g-row.ghead{margin-top:12px;background:var(--panel2);border-radius:8px;padding:5px 0}
.g-lab{width:var(--glab);flex-shrink:0;font-size:12.5px;padding:0 10px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-lab .q{color:var(--muted);font-size:11.5px}
.g-track{flex:1;position:relative;height:24px}
.g-bar{position:absolute;border-radius:4px;box-sizing:border-box}
.g-plan{top:4px;height:16px;border:1.5px dashed #8b9bb088}
.g-eff{top:4px;height:16px;opacity:.4}
.g-real{top:13px;height:3px;border-radius:2px;opacity:.85}
.g-dot{position:absolute;top:8px;height:8px;border-radius:2px;min-width:3px}
.g-sep{position:absolute;width:1px;background:var(--line);z-index:0}
.g-today{position:absolute;width:2px;background:var(--bad);z-index:3;opacity:.85}
.g-wlab{position:absolute;top:2px;font-size:11px;color:var(--muted)}
.mov-chip{color:var(--warn);font-size:11px;font-weight:700}
@media(max-width:680px){
  .gantt{--glab:150px}
  .bar-row .name{width:130px}.bar-row .num{width:90px}
  .sched-item .mt{width:auto}.timer{font-size:48px}
  .row2,.row3{grid-template-columns:1fr}
  .ass-head{display:none}
  .ass-row{grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);padding-bottom:8px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>📊 Estudos SEFAZ-AL — Auditor Fiscal (AFTE)</h1>
      <div class="sub">FGV · Reaplicação 23/08 e 30/08/2026 · Preparação 25/06 → 21/08</div>
    </div>
    <div class="spacer"></div>
    <span id="syncStatus" class="sub" style="align-self:center;margin-right:6px"></span>
    <button class="btn sm" onclick="syncSetup()">☁ Sync</button>
    <button class="btn sm" onclick="exportData()">⭳ Backup</button>
    <button class="btn sm" onclick="document.getElementById('importFile').click()">⭱ Restaurar</button>
    <button class="btn sm" onclick="snapRestaurar()" title="Snapshots automáticos guardados neste navegador">⤺ Snapshots</button>
    <button class="btn sm" onclick="reconstruirDoTec()" title="Repor o histórico a partir das capturas do TEC">⟳ Reconstruir do TEC</button>
    <input type="file" id="importFile" accept="application/json" class="hide" onchange="importData(event)">
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="dash" class="active">Dashboard</button>
    <button data-tab="sessao">Sessão de Estudo</button>
    <button data-tab="assuntos">Assuntos por Matéria</button>
    <button data-tab="disciplina">Disciplina</button>
    <button data-tab="cronograma">Cronograma</button>
    <button data-tab="gantt">Gantt</button>
    <button data-tab="historico">Histórico</button>
  </nav>

  <section id="tab-dash"></section>
  <section id="tab-sessao" class="hide"></section>
  <section id="tab-assuntos" class="hide"></section>
  <section id="tab-disciplina" class="hide"></section>
  <section id="tab-cronograma" class="hide"></section>
  <section id="tab-gantt" class="hide"></section>
  <section id="tab-historico" class="hide"></section>
</div>
<div class="toast" id="toast"></div>

<!-- Execução real por tópico, gerada por 06_Scripts/desempenho_assuntos.py a partir das
     capturas do TEC. Script clássico (não fetch): carrega também via file:// (offline).
     Define window.EXEC_TEC = {por_topico, por_dia, ...}. Ausente => cai nas sessões manuais. -->
<script src="execucao_tec.js" onerror="window.EXEC_TEC=null"></script>

<!-- Sessões reconstruídas das capturas do TEC (06_Scripts/gerar_sessoes_tec.py):
     1 sessão por dia+assunto, com uid determinístico. Rede de segurança para o
     que se perdeu no localStorage: o dashboard só insere o que ainda não tem. -->
<script src="sessoes_tec.js" onerror="window.SESSOES_TEC=null"></script>

<script>
/* ============================================================
   DADOS DE REFERÊNCIA (plano + matérias)
   ============================================================ */
// Grupos de matéria: nome, cor, meta semanal (minutos) conforme o plano
const MAT_INFO = {
  CDADOS:  {nome:"Ciência de Dados", cor:"#4cc2ff", itens:20, meta:220},
  RT:      {nome:"Reforma Tributária", cor:"#f778ba", itens:15, meta:450},
  AUDFIS:  {nome:"Auditoria Fiscal", cor:"#e3b341", itens:15, meta:470},
  INFRA:   {nome:"Infra de TIC e Segurança", cor:"#79c0ff", itens:10, meta:400},
  DEV:     {nome:"Desenvolvimento de Sistemas", cor:"#56d364", itens:10, meta:260},
  IA:      {nome:"Inteligência Artificial", cor:"#7c5cff", itens:10, meta:110},
  LEGAL:   {nome:"Leg. Tributária Estadual (AL)", cor:"#ff9e64", itens:10, meta:500},
  FINPUB:  {nome:"Finanças Públicas", cor:"#8ddb8d", itens:10, meta:180},
  DTRIB:   {nome:"Direito Tributário", cor:"#a0c0b0", itens:10, meta:330},
  ECON:    {nome:"Economia", cor:"#d2a8ff", itens:10, meta:330},
  ESTAT:   {nome:"Estatística", cor:"#a5d6ff", itens:10, meta:120},
  CPUB:    {nome:"Contabilidade Pública", cor:"#c0b0a0", itens:10, meta:200},
  MATFIN:  {nome:"Matemática Financeira", cor:"#b0a0d0", itens:5, meta:90},
  DCON:    {nome:"Direito Constitucional", cor:"#9aa5b1", itens:5, meta:90},
  DADM:    {nome:"Direito Administrativo", cor:"#b08080", itens:5, meta:90},
  CGER:    {nome:"Contabilidade Geral", cor:"#8b9dc3", itens:5, meta:80},
};
// CEX = bloco misto sem matéria própria (consolidação, simulado, caderno de
// erros). Não é matéria do edital, então fica fora do MAT_INFO — mas precisa
// de nome e cor, senão cai no fallback e se disfarça de Direito Tributário.
const CEX_INFO = {nome:"Consolidação e erros", cor:"#9aa5b1"};
function grupo(code){ return MAT_INFO[code] ? code : "DTRIB"; }
function matNome(code){ if(code==="CEX") return CEX_INFO.nome;
  const g=grupo(code); return MAT_INFO[g]?MAT_INFO[g].nome:code; }
function matCor(code){ if(code==="CEX") return CEX_INFO.cor;
  const g=grupo(code); return MAT_INFO[g]?MAT_INFO[g].cor:"#888"; }
function matItens(code){ const g=grupo(code); return MAT_INFO[g]?MAT_INFO[g].itens:0; }

// Assuntos e prioridades vindos das analises em 02_Analises/ (set/2026).
// prio: 1=MAXIMA · 2=ALTA · 3=MEDIA (amostrar) · 4=manutencao
// q: questoes reais no banco · gerar:1 = sem acervo, alvo da skill questao-ce

  // ---- RT ----

  {id:2,assunto:"Outras Questões e Tópicos Mesclados sobre a Reforma Tributária",mat:"RT",prio:3,q:42},
  {id:3,assunto:"IS (CF 1988; EC 132)",mat:"RT",prio:1,q:21},
  {id:4,assunto:"Comitê Gestor do IBS (CF 1988, EC 132)",mat:"RT",prio:1,q:18},
  {id:5,assunto:"Reforma Tributária",mat:"RT",prio:1,q:11},
  {id:6,assunto:"CBS (CF/1988, EC 132)",mat:"RT",prio:1,q:9},

  {id:8,assunto:"Das Hipóteses de Incidência (arts. 4º a 7º da LC nº 214/2025)",mat:"RT",prio:1,q:5},
  {id:9,assunto:"Da Sujeição Passiva (arts. 21 a 26 da LC nº 214/2025)",mat:"RT",prio:1,q:5},
  {id:10,assunto:"Disposições Preliminares (arts. 1º a 3º da LC nº 214/2025)",mat:"RT",prio:3,q:4},
  {id:11,assunto:"Do Local da Operação (art. 11 da LC nº 214/2025)",mat:"RT",prio:1,q:4},
  {id:12,assunto:"Do Momento de Ocorrência do Fato Gerador (art. 10 da LC nº 214/2025)",mat:"RT",prio:3,q:3},
  {id:13,assunto:"Das Modalidades de Extinção dos Débitos (arts. 27 a 37 da LC nº 214/2025)",mat:"RT",prio:1,q:3},
  {id:14,assunto:"Do Comitê Gestor do IBS (arts. 480 a 484 da LC nº 214/2025)",mat:"RT",prio:1,q:3},
  // ---- AUDFIS ----
  {id:15,assunto:"Testes e Procedimentos em Auditoria",mat:"AUDFIS",prio:3,q:74,fora:1},
  {id:16,assunto:"Fraude e Erro (Auditoria)",mat:"AUDFIS",prio:3,q:22,fora:1},
  {id:17,assunto:"Sistema Público de Escrituração Digital (SPED)",mat:"AUDFIS",prio:2,q:12},
  {id:18,assunto:"Planejamento de Auditoria de Regularidade",mat:"AUDFIS",prio:3,q:8,fora:1},
  {id:19,assunto:"Relatório, Certificado, Parecer e Nota (Auditoria Governamental)",mat:"AUDFIS",prio:3,q:7,fora:1},
  {id:20,assunto:"Instruções Normativas da RFB sobre Escrituração Contábil Digital",mat:"AUDFIS",prio:2,q:6},
  {id:21,assunto:"Escrituração Fiscal e Outras Questões Tributárias",mat:"AUDFIS",prio:1,q:6},
  {id:22,assunto:"Execução de Auditoria de Regularidade",mat:"AUDFIS",prio:3,q:5,fora:1},
  {id:23,assunto:"Conceitos de SPED e seus Módulos",mat:"AUDFIS",prio:3,q:3},
  // ---- INFRA ----
  {id:24,assunto:"ITIL v4",mat:"INFRA",prio:3,q:118},
  {id:25,assunto:"Cloud Computing (Computação em Nuvem)",mat:"INFRA",prio:3,q:105},
  {id:26,assunto:"DevOps, IaC, Integração Contínua e Entrega Contínua",mat:"INFRA",prio:2,q:61},
  {id:27,assunto:"Contêineres (Docker, Kubernetes, etc.)",mat:"INFRA",prio:3,q:51},
  {id:28,assunto:"Riscos em Segurança da Informação (NBR ISO/IEC 27001, 27002 e 27005)",mat:"INFRA",prio:2,q:43},

  {id:33,assunto:"Gestão de Continuidade de Negócio (NBR ISO/IEC 15999-1, 15999-2, 27002, 22313, etc.)",mat:"INFRA",prio:2,q:24},

  {id:35,assunto:"Malware (Vírus, Worms, Trojans, etc.)",mat:"INFRA",prio:3,q:20},
  {id:36,assunto:"ICP e Autoridades Certificadoras",mat:"INFRA",prio:2,q:20},

// Renderiza o bloco copiar/ver códigos de um assunto (id do plano). Sem id colidente
// no DOM: verCods age sobre o irmão .cods-list. Retorna "" se não houver código.
function codigosUI(id){
  const c=topicCodigos(id); if(!c.length) return "";
  return `<span class="cods"><button class="btn xs" title="Copiar ${c.length} códigos p/ colar no TEC" onclick="copiarCods(event,${id})">📋 ${c.length}</button><span class="cods-ver" onclick="verCods(event)">ver</span><span class="cods-list hide">${c.join(" ")}</span></span>`;

function copiarCods(ev,id){
  ev.stopPropagation();
  const c=topicCodigos(id); if(!c.length){ toast("Sem códigos p/ este assunto"); return; }
  const txt=c.join(" "), ok=()=>toast(c.length+" códigos copiados ✓");
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
  else fallbackCopy(txt,ok);
}
function fallbackCopy(txt,ok){
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){ toast("Copie manualmente na lista"); }
  document.body.removeChild(ta);
}
function verCods(ev){
  ev.stopPropagation();
  const box=ev.currentTarget.parentNode.querySelector(".cods-list");
  box.classList.toggle("hide");
  ev.currentTarget.textContent=box.classList.contains("hide")?"ver":"ocultar";
}

/* ============================================================
   ESTADO / PERSISTÊNCIA
   ============================================================ */
const LS_KEY = "estudosSEFAZAL_v1"; // v2: assuntos repriorizados a partir das análises (jun/2026)
const LS_SNAP = "estudosSEFAZAL_v1_snap"; // anel de snapshots locais (rede de segurança)
const LS_DEV  = "estudosSEFAZAL_deviceId"; // id da máquina, fora do estado (não vai p/ o Gist)

/* Identidade da máquina: usada para gerar uid de sessão que NUNCA colide entre
   computadores. Antes o id era um contador (1,2,3…) que reiniciava em cada
   máquina — dois registros diferentes recebiam o mesmo id e qualquer tentativa
   de juntar os estados perdia dados. */
function deviceId(){
  let d = localStorage.getItem(LS_DEV);
  if(!d){ d = Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); localStorage.setItem(LS_DEV,d); }
  return d;
}
/* uid determinístico para sessões antigas (sem uid): derivado do CONTEÚDO, não da
   máquina — assim a mesma sessão já sincronizada entre os dois PCs recebe o mesmo
   uid nos dois lados e o merge a reconhece como uma só (não duplica). */
function uidLegado(s){
  return "L~" + [s.id, s.data, s.mat, s.topicId||s.assuntoLivre||"", s.minutos||0,
                 s.qResolvidas||0, s.qAcertadas||0].join("~");
}
function novoUid(){ return deviceId()+":"+(state.nextSid++)+":"+Date.now().toString(36); }

let state = load();

function defaultState(){
  const ts = {};
  SEED_TOPICS.forEach(t=> ts[t.id] = "nao");
  return { schema:3, sessions:[], topicStatus:ts, topicStatusAt:{}, customTopics:[],
           nextSid:1, nextTid:1000, revFeitas:{}, revFeitasAt:{}, sessionsDel:{},
           sobraFeitas:{}, sobraN:{} };
}
function migrar(s){
  s.sessions = (s.sessions||[]).filter(x=>x&&typeof x==="object");
  s.sessions.forEach(x=>{ if(!x.uid) x.uid = uidLegado(x); });
  // dedup defensivo por uid (estados que já vieram bagunçados de syncs antigas)
  const vistos={}; s.sessions = s.sessions.filter(x=> vistos[x.uid] ? false : (vistos[x.uid]=1));
  s.sessionsDel = s.sessionsDel || {};
  s.topicStatusAt = s.topicStatusAt || {};
  s.revFeitasAt = s.revFeitasAt || {};
  s.customTopics = s.customTopics || [];
  s.sobraFeitas = s.sobraFeitas || {};   // backlog de tempo livre: id -> última data feita
  s.sobraN      = s.sobraN      || {};   // backlog de tempo livre: id -> nº de vezes
  s.schema = 3;
  return s;
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    // garante que assuntos novos do seed ganhem status
    s.topicStatus = s.topicStatus || {};
    SEED_TOPICS.forEach(t=>{ if(!(t.id in s.topicStatus)) s.topicStatus[t.id]="nao"; });
    return migrar(Object.assign(d, s));
  }catch(e){ return defaultState(); }
}
function gravarLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("⚠ Falha ao gravar no navegador"); } }
function save(){ state.updatedAt=new Date().toISOString(); gravarLocal(); syncAgendar(); }

/* --- Snapshots locais: guarda as últimas versões do estado antes de qualquer
   substituição vinda da nuvem. Se algo der errado, dá para voltar sem depender
   de backup manual. --- */
const SNAP_MAX = 12;
function snapshot(motivo){
  try{
    const arr = JSON.parse(localStorage.getItem(LS_SNAP)||"[]");
    arr.unshift({ts:new Date().toISOString(), motivo, n:(state.sessions||[]).length, estado:state});
    localStorage.setItem(LS_SNAP, JSON.stringify(arr.slice(0,SNAP_MAX)));
  }catch(e){ /* cota cheia: descarta os mais antigos e desiste em silêncio */
    try{ localStorage.setItem(LS_SNAP,"[]"); }catch(_){}
  }
}
function snapRestaurar(){
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem(LS_SNAP)||"[]"); }catch(e){}
  if(!arr.length){ alert("Nenhum snapshot local guardado ainda."); return; }
  const lista = arr.map((s,i)=>`${i+1}) ${s.ts.slice(0,16).replace("T"," ")} · ${s.n} sessões · ${s.motivo}`).join("\n");
  const esc = prompt("Snapshots locais (o estado ANTES de cada substituição):\n\n"+lista+
    "\n\nDigite o número para restaurar (o estado atual vira snapshot antes):","");
  const i = parseInt(esc)-1;
  if(isNaN(i)||!arr[i]) return;
  snapshot("antes de restaurar snapshot");
  state = migrar(Object.assign(defaultState(), arr[i].estado));
  save();
  const ab=document.querySelector("#tabs button.active"); render(ab?ab.dataset.tab:"dash");
  toast("Snapshot restaurado ("+arr[i].n+" sessões)");
}

  return m+"min";
}
function fmtClock(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
}

function startOfWeek(d){ // segunda
  const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x;
}
function inThisWeek(dateStr){
  const sow=startOfWeek(new Date()); const eow=new Date(sow); eow.setDate(eow.getDate()+7);
  const d=new Date(dateStr+"T12:00:00"); return d>=sow && d<eow;
}

  const m={}; sessionsFiltered(weekOnly).forEach(s=>{ const g=grupo(s.mat); m[g]=(m[g]||0)+(s.minutos||0); }); return m;
}
function questoesPorGrupo(weekOnly){
  const m={}; sessionsFiltered(weekOnly).forEach(s=>{ const g=grupo(s.mat); if(!m[g])m[g]={qr:0,qa:0}; m[g].qr+=s.qResolvidas||0; m[g].qa+=s.qAcertadas||0; }); return m;
}
function topicQuestoes(tid){
  let qr=0,qa=0; state.sessions.forEach(s=>{ if(String(s.topicId)===String(tid)){qr+=s.qResolvidas||0;qa+=s.qAcertadas||0;} }); return {qr,qa};
}
function topicMin(tid){ let m=0; state.sessions.forEach(s=>{ if(String(s.topicId)===String(tid)) m+=s.minutos||0; }); return m; }
function diasEstudados(){ return new Set(state.sessions.filter(s=>s.minutos>0).map(s=>s.data)).size; }
function streak(){
  const dias=new Set(state.sessions.filter(s=>s.minutos>0).map(s=>s.data));
  let n=0; let d=new Date();
  // se hoje não estudou, começa de ontem
  if(!dias.has(todayStr())) d.setDate(d.getDate()-1);
  for(;;){ const ds=d.toISOString().slice(0,10); if(dias.has(ds)){n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}

/* Desempenho REAL por assunto — consolidado de TODAS as questões registradas no
   TEC (06_Scripts/desempenho_assuntos.py grava Estudos/desempenho_assuntos.json).
   Independe do lançamento manual de sessões, que costuma ficar incompleto. */
let DESEMP_TEC=null;
function corPct(p){ return p>=80?"var(--ok)":(p>=70?"var(--warn)":"var(--bad)"); }

/* --- MÉTRICA: acerto bruto × domínio estimado -------------------------------
   Em prova CERTO/ERRADO (CEBRASPE) o acerto bruto não mede conhecimento: a linha
   de base do chute é 50%, então 80% de acerto equivale a 60% de domínio e 50%
   equivale a ZERO. A métrica válida é a fração dominada, que pode ser negativa —
   e negativo é informação: responder aquele assunto custa ponto em vez de render.

   ⚠ 11/09/2026 — o número deixou de ser o saldo líquido literal. O acervo do TEC
   mistura C/E e MÚLTIPLA ESCOLHA (~51% dele é ME), e aplicar a régua do C/E a uma
   amostra de ME subestimava feio: "Da Sujeição Passiva", 4 dos 5 itens em ME,
   aparecia aqui como −20%/ELIMINA quando o domínio real é 25%. O
   desempenho_assuntos.py passou a estimar a fração de ME de cada amostra e a
   corrigir a linha do chute: `domínio = (acertos − c·respondidas)/((1−c)·total)`,
   com c entre 0,20 (ME puro) e 0,50 (C/E puro). Em amostra 100% C/E o valor é
   idêntico ao saldo de antes. O campo continua chamando `saldo_pct_unicas` por
   compatibilidade; o literal está em `saldo_bruto_pct_unicas` e a mistura
   estimada, em `fracao_me_unicas`.

   O desempenho_assuntos.py grava `formato` e os campos de saldo. Arquivos do
   ciclo FGV não têm nenhum dos dois e caem no acerto bruto automaticamente. --- */
const PISO_SALDO=30;   // piso de eliminação do edital (item 8.11.5)
const META_SALDO=60;   // meta do Plano_Estudos_Set-Dez.md
let MODO_CE=false;
function metrica(o){ return MODO_CE ? (o.saldo_pct_unicas ?? 0) : o.pct_unicas; }
function refMetrica(){ return MODO_CE ? META_SALDO : 70; }
function rotMetrica(){ return MODO_CE ? "domínio" : "acerto"; }
function corMetrica(v){
  return MODO_CE ? (v>=META_SALDO?"var(--ok)":v>=PISO_SALDO?"var(--warn)":"var(--bad)")
                 : corPct(v);
}
function drawDesempTec(){
  const box=document.getElementById("desempTecBox"); if(!box) return;
  if(!DESEMP_TEC){
    box.innerHTML=`<div class="card" style="border-left:3px solid var(--accent2)"><b>Desempenho real por assunto</b> — rode <code>python 06_Scripts/desempenho_assuntos.py</code> e faça commit de <code>Estudos/desempenho_assuntos.json</code> para ver aqui o consolidado de todas as questões do TEC (não só as sessões lançadas à mão).</div>`;
    return;
  }
  const R=DESEMP_TEC.resumo, mats=DESEMP_TEC.materias||[], ass=DESEMP_TEC.assuntos||[];
  const crit=ass.filter(a=>a.unicas>=4 && metrica(a)<refMetrica() && a.assunto!=="Sem assunto")
                .sort((a,b)=>metrica(a)-metrica(b));
  // saldo pode ser negativo: a barra zera e o número em vermelho carrega o sinal
  const barMat=mats.filter(m=>m.materia!=="Sem materia")
    .sort((a,b)=>metrica(a)-metrica(b)).map(m=>{ const v=metrica(m), c=corMetrica(v);
    return `
    <div style="display:flex;align-items:center;gap:8px;margin:3px 0">
      <div style="flex:0 0 50px;text-align:right;font-weight:600;color:${c}">${v}%</div>
      <div style="flex:1;background:#0003;border-radius:4px;height:14px;overflow:hidden">
        <div style="width:${Math.max(0,v)}%;height:100%;background:${c}"></div></div>
      <div style="flex:0 0 54px;font-size:11px;color:var(--muted)">${m.acertos_unicas}/${m.unicas}</div>
      <div style="flex:2;font-size:12px">${escapeHtml(m.materia)}</div>
    </div>`;}).join("");
  const cab = MODO_CE
    ? `${R.unicas} questões · domínio ${R.saldo_pct_unicas}% (${R.pct_unicas}% bruto)`
    : `${R.unicas} questões · ${R.pct_unicas}%`;
  const nota = MODO_CE
    ? `Consolida <b>${R.tentativas}</b> respostas (${R.unicas} únicas; estado pela tentativa mais recente).
       <b>Barras em domínio estimado</b>, corrigido pelo chute: em C/E, 50% de acerto vale <b>0</b>; em múltipla escolha, 20%.
       Piso de eliminação ${PISO_SALDO}% · meta do plano ${META_SALDO}%.
       ${R.fracao_me_unicas>0?`Amostra ~<b>${Math.round(100*R.fracao_me_unicas)}%</b> múltipla escolha (saldo líquido literal: ${R.saldo_bruto_pct_unicas}%).`:""}
       ${R.brancos_unicas?`<b>${R.brancos_unicas}</b> em branco (${R.pct_branco_unicas}%).`:""}`
    : `Consolida <b>${R.tentativas}</b> respostas registradas (${R.unicas} questões únicas; % pela tentativa mais recente). Fonte independente do lançamento manual de sessões.`;
  box.innerHTML=`
  <details class="card" open style="border-left:3px solid var(--accent)">
    <summary style="cursor:pointer;font-weight:600">🎯 Desempenho real por assunto — todas as questões do TEC
      <span style="color:var(--muted);font-weight:400">(${cab} · gerado ${(DESEMP_TEC.gerado_em||"").slice(0,10)})</span></summary>
    <div style="font-size:12px;color:var(--muted);margin:6px 0">${nota}</div>
    <div style="margin:10px 0">${barMat}</div>
    <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;color:var(--bad)">⚠️ ${crit.length} assuntos críticos (${rotMetrica()} &lt;${refMetrica()}%, ≥4 questões)</summary>
      <table style="margin-top:6px"><tbody>${crit.map(a=>{ const v=metrica(a);
        return `<tr><td style="color:${corMetrica(v)};font-weight:600;white-space:nowrap">${v}%${MODO_CE&&v<PISO_SALDO?" ⛔":""}</td>
        <td style="color:var(--muted);white-space:nowrap">${a.acertos_unicas}/${a.unicas}${MODO_CE?` · ${a.pct_unicas}% br.`:""}</td>
        <td>${escapeHtml(a.assunto)}</td></tr>`;}).join("")}</tbody></table></details>
  </details>`;
}

    .map(b=>({b, hojeFeito:state.sobraFeitas[b.id]===hoje?1:0, pulado:sobraSkip[b.id]?1:0}))
    .sort((x,y)=> x.pulado-y.pulado || x.hojeFeito-y.hojeFeito || x.b.prio-y.b.prio)
    .map(x=>x.b);
}

  state.sobraFeitas[id]=todayStr();
  state.sobraN[id]=(state.sobraN[id]||0)+1;

}

  const tops=allTopics(); const concl=tops.filter(t=>state.topicStatus[t.id]==="concluido").length;

  const diasRest=Math.max(0,Math.ceil((new Date(PROVA1)-new Date())/86400000));
  const metaTotal=Object.values(MAT_INFO).reduce((a,m)=>a+m.meta,0);

  let html = `
  <div class="grid cards">
    <div class="card kpi"><div class="label">⏱️ Tempo total estudado</div><div class="val">${fmtMin(all.min)}</div><div class="foot">${diasEstudados()} dia(s) com estudo · 🔥 streak ${streak()}</div></div>
    <div class="card kpi"><div class="label">📅 Esta semana</div><div class="val">${fmtMin(wk.min)} <small>/ ${fmtMin(metaTotal)}</small></div><div class="foot">${pct(wk.min,metaTotal)}% da meta semanal (${fmtMin(metaTotal)})</div></div>
    <div class="card kpi"><div class="label">✍️ Questões resolvidas</div><div class="val">${all.qr} <small>/ ${metaPlanoTotal()}</small></div><div class="foot">${wk.qr} esta semana · ${pct(all.qr,metaPlanoTotal())}% da meta do plano</div></div>
    <div class="card kpi"><div class="label">🎯 Taxa de acerto</div><div class="val">${pct(all.qa,all.qr)}<small>%</small></div><div class="foot">${all.qa}/${all.qr} acertos</div></div>
    <div class="card kpi"><div class="label">📚 Assuntos concluídos</div><div class="val">${concl}<small>/${tops.length}</small></div><div class="foot">${emand} em andamento · ${pct(concl,tops.length)}% do edital</div></div>
    <div class="card kpi"><div class="label">⏳ Dias até a prova</div><div class="val">${diasRest}</div><div class="foot">objetiva 20/12/2026 · discursiva 10/01/2027</div></div>
  </div>`;

  // Backlog de tempo livre — o que fazer quando a meta do dia fechou e sobrou tempo
  html += cardSobra();

  // Horas por matéria na semana vs meta
  const mg=minutosPorGrupo(true);
  const ordem=Object.keys(MAT_INFO).filter(g=>MAT_INFO[g].meta>0);
  html += `<h2 class="sec">⏲️ Horas por matéria — esta semana <span class="pill">barra = estudado · marca branca = meta semanal</span></h2><div class="card">`;
  ordem.forEach(g=>{
    const done=mg[g]||0, meta=MAT_INFO[g].meta, p=meta>0?Math.min(100,done/meta*100):0;
    const metaPos=meta>0?Math.min(100,100):0;
    html += barRow(MAT_INFO[g].nome, p, `${fmtMin(done)} / ${fmtMin(meta)}`, MAT_INFO[g].cor, true);
  });
  html += `</div>`;

  // Acerto por matéria (geral)
  const qg=questoesPorGrupo(false);
  const comQ=Object.keys(qg).filter(g=>qg[g].qr>0).sort((a,b)=>pct(qg[a].qa,qg[a].qr)-pct(qg[b].qa,qg[b].qr));
  html += `<h2 class="sec">🎯 Desempenho em questões por matéria <span class="pill">acumulado</span></h2><div class="card">`;
  if(comQ.length===0) html += `<div class="empty">Nenhuma questão registrada ainda. Registre na aba <b>Sessão de Estudo</b>.</div>`;
  comQ.forEach(g=>{
    const p=pct(qg[g].qa,qg[g].qr);
    const cor = p>=70?"var(--ok)":p>=50?"var(--warn)":"var(--bad)";
    html += barRow(MAT_INFO[g]?MAT_INFO[g].nome:g, p, `${p}% (${qg[g].qa}/${qg[g].qr})`, cor, false);
  });
  html += `</div>`;

  // Sessões recentes
  html += `<h2 class="sec">🕘 Últimas sessões</h2><div class="card">`+ recentTable(6) +`</div>`;

  document.getElementById("tab-dash").innerHTML = html;
}
function barRow(name, percent, numTxt, cor, showMeta){
  return `<div class="bar-row"><div class="name">${escapeHtml(name)}</div>
    <div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,percent))}%;background:${cor||'var(--accent)'}"></div>${showMeta?'<div class="meta" style="left:100%"></div>':''}</div>
    <div class="num">${numTxt}</div></div>`;
}
function recentTable(n){
  const ss=[...state.sessions].sort((a,b)=> (b.data+String(b.id)).localeCompare(a.data+String(a.id))).slice(0,n||999);
  if(ss.length===0) return `<div class="empty">Sem sessões registradas ainda.</div>`;
  let h=`<table><thead><tr><th>Data</th><th>Matéria</th><th>Assunto</th><th>Tempo</th><th class="right">Questões</th><th class="right">Acerto</th></tr></thead><tbody>`;
  ss.forEach(s=>{
    const t=s.topicId?topicById(s.topicId):null;
    const ass=t?t.assunto:(s.assuntoLivre||"—");
    const ac=s.qResolvidas>0?pct(s.qAcertadas,s.qResolvidas)+"%":"—";
    h+=`<tr><td>${fmtData(s.data)}</td><td><span class="dot" style="background:${matCor(s.mat)}"></span> ${matNome(s.mat)}</td><td>${escapeHtml(ass)}</td><td>${fmtMin(s.minutos)}</td><td class="right">${s.qResolvidas||0}</td><td class="right">${ac}</td></tr>`;
  });
  return h+`</tbody></table>`;
}

function timerToggle(){

    timer.intv=setInterval(updateTimerDisp,1000);
  } else {
    timer.accMs += Date.now()-timer.startTs; timer.startTs=null; timer.running=false;
    b.textContent="▶ Continuar"; disp.classList.remove("running"); clearInterval(timer.intv);
  }

function salvarSessao(){
  const msg=document.getElementById("sessMsg");
  const err=t=>{ msg.textContent=t; msg.style.color="var(--bad)"; };
  const rows=[...document.querySelectorAll("#assRows .ass-row")];
  if(rows.length===0){ err("⚠️ Adicione pelo menos um assunto."); return; }
  const itens=[];
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    const qr=parseInt(r.querySelector(".r-qr").value)||0, qa=parseInt(r.querySelector(".r-qa").value)||0;
    if(qa>qr){ err(`⚠️ Assunto ${i+1}: acertos não podem exceder resolvidas.`); return; }
    itens.push({mat:r.querySelector(".r-mat").value, assSel:r.querySelector(".r-ass").value, qr, qa});
  }
  const ids=itens.filter(x=>x.assSel!=="__livre").map(x=>x.assSel);
  if(new Set(ids).size!==ids.length){ err("⚠️ Há assuntos repetidos na sessão."); return; }
  let minutos=parseInt(document.getElementById("fMin").value);
  if(isNaN(minutos)||minutos<=0){ const ts=timerSec(); if(ts>0) minutos=Math.max(1,Math.round(ts/60)); }
  if(isNaN(minutos)||minutos<0) minutos=0;
  const qrTot=itens.reduce((a,x)=>a+x.qr,0);
  if(minutos===0 && qrTot===0){ err("⚠️ Informe tempo ou questões."); return; }
  for(let i=0;i<itens.length;i++){
    const x=itens[i];
    if(x.assSel==="__livre"){ x.assuntoLivre=(prompt(`Digite o assunto estudado (linha ${i+1}):`)||"").trim(); if(!x.assuntoLivre) return; x.topicId=null; }
    else { x.topicId=x.assSel; x.assuntoLivre=""; }
  }
  // um registro por assunto: tempo dividido igualmente (sobra vai para as primeiras linhas)
  const n=itens.length, base=Math.floor(minutos/n); let resto=minutos-base*n;
  const data=document.getElementById("fData").value||todayStr();
  const obs=document.getElementById("fObs").value.trim();
  const st=document.getElementById("fStatus").value;
  itens.forEach((x,i)=>{
    const m=base+(resto>0?1:0); if(resto>0)resto--;
    const sid=state.nextSid;
    state.sessions.push({ uid:novoUid(), id:sid, data, mat:x.mat, topicId:x.topicId, assuntoLivre:x.assuntoLivre,
      minutos:m, qResolvidas:x.qr, qAcertadas:x.qa, obs:i===0?obs:"", criadoEm:new Date().toISOString() });
    if(st && x.topicId) setTopicStatus(x.topicId, st);
  });
  save();
  // limpar
  document.getElementById("fMin").value=""; document.getElementById("fObs").value=""; document.getElementById("fStatus").value="";
  document.getElementById("assRows").innerHTML=""; addAssRow();
  timerReset();
  msg.textContent = n>1 ? `✓ Sessão salva (${n} assuntos)!` : "✓ Sessão salva!"; msg.style.color="var(--ok)";
  toast("Sessão registrada"); renderHoje();
}

   ASSUNTOS POR MATÉRIA
   ============================================================ */
const STATUS_LABEL={nao:"Não iniciado",estudando:"Estudando",revisar:"Revisar",concluido:"Concluído"};

/* ---- Semana do plano, por assunto -------------------------------------
   Cada assunto tem ATÉ DUAS semanas no QPLAN: p1 = aquisição (1ª passagem,
   semanas 1-10) e p2 = revisita em regime de questões (Fase 3). A semana de
   aquisição exibida/filtrada é a REPLANEJADA (`semEff` de replanejar()), que é
   a mesma régua do Cronograma e do Gantt — assunto atrasado migra de semana lá
   e tem de migrar aqui também. Assunto sem entrada no QPLAN (criado à mão)
   fica em "sem semana".
   `assSemBase="orig"` volta para a semana fixa do plano — necessário porque, na
   régua replanejada, uma semana já vencida fica vazia (tudo que não fechou
   migrou para a semana corrente) e sem isso não há como revisitá-la. */
let assSemBase="eff"; // "eff" = replanejada · "orig" = plano original
function semanasTopico(id,plano){
  const info=plano?plano.info[id]:null;
  const aqOrig=topicSemana(id);
  const aq=(assSemBase==="orig") ? aqOrig : (info?info.semEff:aqOrig);
  return {aq, aqOrig, semEff:info?info.semEff:aqOrig, rev:topicSemanaRev(id),
          movido:!!(info&&info.movido&&info.semEff!==aqOrig),
          ok:!!(info&&info.ok), resto:info?info.resto:0};
}
function chipsSemana(id,plano){
  const s=semanasTopico(id,plano); let h="";
  // o chip mostra sempre plano→replanejado, em qualquer régua: é o mesmo fato
  if(s.aq>0) h+=s.movido
    ? `<span class="semchip mov" title="aquisição: plano S${s.aqOrig} → replanejado S${s.semEff} (meta não cumprida)">S${s.aqOrig}→${s.semEff}</span>`
    : `<span class="semchip" title="semana de aquisição (1ª passagem)">S${s.aq}</span>`;
  if(s.rev>0) h+=`<span class="semchip rev" title="revisita em regime de questões (Fase 3)">R${s.rev}</span>`;
  return h;
}
function semanaHoje(){ return Math.min(15,Math.max(1,semanaDoDia(new Date()))); }
function faseCurta(n){ return n<=5?"F1":(n<=ULT_AQUISICAO?"F2":(n<=ULT_SEMANA?"F3":"Consol.")); }

/* Contagem de assuntos por semana, na régua em vigor (assSemBase). Um assunto
   conta nas DUAS semanas em que aparece: aquisição e revisita. */
function contagemPorSemana(plano){
  const cnt={}; let semSem=0;
  allTopics().forEach(t=>{ const s=semanasTopico(t.id,plano);
    if(s.aq>0) cnt[s.aq]=(cnt[s.aq]||0)+1;
    if(s.rev>0 && s.rev!==s.aq) cnt[s.rev]=(cnt[s.rev]||0)+1;
    if(s.aq<=0 && s.rev<=0) semSem++; });
  return {cnt, semSem};
}
/* Os rótulos do select levam a contagem, que muda quando a régua muda — então
   são reescritos a cada desenho, não fixados no HTML. */
function atualizarOpcoesSemana(plano,wNow){
  const sel=document.getElementById("filtSem"); if(!sel||!sel.options) return;
  const {cnt,semSem}=contagemPorSemana(plano);
  const atrasados=Object.values(plano.info).filter(i=>!i.ok && i.semOrig<wNow && i.resto>0).length;
  for(const o of sel.options){
    const n=(cnt[+o.value]||0), suf=v=>v?` (${v})`:"";
    if(o.value==="") o.textContent="Todas as semanas";
    else if(o.value==="atual") o.textContent=`📌 Semana atual — S${wNow}${suf(cnt[wNow]||0)}`;
    else if(o.value==="atraso") o.textContent=`⏰ Atrasados${suf(atrasados)}`;
    else if(o.value==="0") o.textContent=`— sem semana no plano${suf(semSem)}`;
    else { const s=SEMANAS[+o.value-1]; if(s) o.textContent=`S${s.n} · ${s.per} · ${faseCurta(s.n)}${suf(n)}`; }
  }
}

function drawAssuntos(){
  const fM=document.getElementById("filtMat").value, fS=document.getElementById("filtStatus").value, fB=(document.getElementById("filtBusca").value||"").toLowerCase();
  const fP=document.getElementById("filtPrio").value;
  const matchPrio=t=> !fP ? true : (fP==="gerar" ? !!t.gerar : String(t.prio||3)===fP);
  // Semana: "" todas · "atual" a semana de hoje · "atraso" meta vencida e não
  // cumprida · "0" fora do plano · "1".."15" a semana escolhida
  const fSemRaw=document.getElementById("filtSem").value;
  assSemBase=(document.getElementById("filtSemBase")||{}).value||"eff";
  const plano=replanejar(), wNow=semanaHoje();
  atualizarOpcoesSemana(plano,wNow);
  const fW = fSemRaw==="atual" ? wNow : (/^\d+$/.test(fSemRaw) ? +fSemRaw : null);
  const matchSem=t=>{
    if(!fSemRaw) return true;
    const s=semanasTopico(t.id,plano);
    if(fSemRaw==="atraso") return !s.ok && s.aqOrig>0 && s.aqOrig<wNow && s.resto>0;
    if(fW===0) return s.aq<=0 && s.rev<=0;
    return s.aq===fW || s.rev===fW;
  };
  const groups=Object.keys(MAT_INFO).filter(g=>allTopics().some(t=>grupo(t.mat)===g));
  let html="", sel=[];
  groups.forEach(g=>{
    if(fM && fM!==g) return;
    let ts=allTopics().filter(t=>grupo(t.mat)===g);
    ts=ts.filter(t=> (!fS||state.topicStatus[t.id]===fS) && matchPrio(t) && matchSem(t) && (!fB||t.assunto.toLowerCase().includes(fB)) );
    if(ts.length===0) return;
    sel=sel.concat(ts);
    const totG=allTopics().filter(t=>grupo(t.mat)===g);
    const conclG=totG.filter(t=>state.topicStatus[t.id]==="concluido").length;
    ts.sort(prioSort);
    html+=`<div class="mat-group"><div class="mat-head" onclick="this.nextElementSibling.classList.toggle('hide')">
      <span class="dot" style="background:${MAT_INFO[g].cor};width:12px;height:12px"></span>
      <span class="mname">${MAT_INFO[g].nome}</span>
      ${fSemRaw?`<span class="qstat">${ts.length} no filtro</span>`:""}
      <span class="mbar"><i style="width:${pct(conclG,totG.length)}%"></i></span>
      <span class="mprog">${conclG}/${totG.length} concl.</span>
    </div><div class="mat-body"><table><tbody>`;
    ts.forEach(t=>{
      const stv=state.topicStatus[t.id]||"nao"; const q=topicQuestoes(t.id); const mn=topicMin(t.id);
      const pr=t.prio||3; const meta=topicMeta(t.id);
      const semChip = chipsSemana(t.id,plano);
      let qCol;
      if(meta>0){
        const okMeta = q.qr>=meta;
        qCol = `<b style="color:${okMeta?'var(--ok)':'var(--txt)'}">${q.qr}/${meta}q</b>${q.qr>0?` · ${pct(q.qa,q.qr)}%`:''}`;
      } else qCol = q.qr>0?`${q.qr}q · ${pct(q.qa,q.qr)}%`:'<span class="muted">—</span>';
      const cods=codigosUI(t.id);
      html+=`<tr>
        <td style="width:46%"><span class="prio p${pr}">${PRIO_LABEL[pr]}</span>${t.gerar?'<span class="badge2025">🔨 gerar</span>':''} ${semChip} ${escapeHtml(t.assunto)}${cods?'<br>'+cods:''}</td>
        <td>${mn>0?fmtMin(mn):'<span class="muted">—</span>'}</td>
        <td>${qCol}</td>
        <td class="right">
          <select onchange="setStatus('${t.id}',this.value)" class="st-sel">
            ${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}" ${k===stv?"selected":""}>${v}</option>`).join("")}
          </select>
        </td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });
  document.getElementById("assBox").innerHTML=html||`<div class="empty">Nenhum assunto encontrado com esses filtros.</div>`;
  desenharSemResumo(fSemRaw,fW,wNow,plano,sel);
}
/* Cartão de contexto da semana filtrada: o que o plano manda fazer nela, quantas
   questões ela pede e quanto tempo isso custa no ritmo de cada matéria. */
function desenharSemResumo(fSemRaw,fW,wNow,plano,sel){
  const box=document.getElementById("semResumo"); if(!box) return;
  if(!fSemRaw){ box.innerHTML=""; return; }
  if(fSemRaw==="atraso"){
    const resto=sel.reduce((a,t)=>a+semanasTopico(t.id,plano).resto,0);
    const min=sel.reduce((a,t)=>a+semanasTopico(t.id,plano).resto/ritmo(grupo(t.mat))*60,0);
    box.innerHTML=`<div class="card sem-box" style="border-color:var(--warn)">
      <b class="wk">⏰ Atrasados</b> <span class="muted">— meta da 1ª passagem vencida antes da S${wNow} e ainda não cumprida</span><br>
      <b>${sel.length}</b> assuntos · <b>${resto}q</b> pendentes · ~<b>${fmtMin(min)}</b> no ritmo de cada matéria
      <span class="muted">· o chip <span class="semchip mov">S→S</span> mostra para qual semana cada um já migrou</span></div>`;
    return;
  }
  if(fW===0){
    box.innerHTML=`<div class="card sem-box"><b class="wk">— Sem semana no plano</b>
      <span class="muted">— ${sel.length} assunto(s) fora do QPLAN (criados à mão ou sem meta de questões). Não entram no Cronograma nem no Gantt.</span></div>`;
    return;
  }
  const s=SEMANAS[fW-1]; if(!s){ box.innerHTML=""; return; }
  let aq=0, rev=0, metaQ=0, min=0, concl=0;
  sel.forEach(t=>{ const z=semanasTopico(t.id,plano), g=grupo(t.mat);
    if(z.aq===fW){ aq++; metaQ+=topicMeta(t.id); min+=topicMeta(t.id)/ritmo(g)*60; }
    if(z.rev===fW){ rev++; metaQ+=topicMetaRev(t.id); min+=topicMetaRev(t.id)/ritmo(g)*60; }
    if(state.topicStatus[t.id]==="concluido") concl++; });
  const blocos=[s.ext?`extensão <b>${matNome(s.ext)}</b>`:null, s.bloco?`bloco <b>${matNome(s.bloco)}</b>`:null,
                s.cauda?`cauda <b>${matNome(s.cauda)}</b>`:null].filter(Boolean).join(" · ");
  // Semana vazia tem duas causas legítimas — dizer qual, senão parece defeito.
  let nota="";
  if(sel.length===0){
    const noPlano=allTopics().filter(t=>topicSemana(t.id)===fW||topicSemanaRev(t.id)===fW).length;
    if(fW>ULT_SEMANA) nota=`<br><span class="muted">Semana de consolidação: o plano não aloca aquisição nem revisita aqui — é releitura de tabelas-âncora e lei seca.</span>`;
    else if(assSemBase==="eff" && noPlano) nota=`<br><span class="muted">Vazia na régua <b>replanejada</b>: os ${noPlano} assuntos originais desta semana já migraram para frente. Troque para <b>📋 semana do plano original</b> para vê-los.</span>`;
  }
  box.innerHTML=`<div class="card sem-box" style="border-color:${fW===wNow?"var(--accent)":"var(--line)"}">
    <b class="wk">📅 Semana ${s.n}</b> <span class="muted">${s.per} · ${escapeHtml(s.fase)}</span>
    ${fW===wNow?'<span class="now-pill" style="background:var(--ok);color:#06121c;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px">semana atual</span>':""}<br>
    ${blocos||'<span class="muted">sem grade — consolidação</span>'}<br>
    <b>${sel.length}</b> assuntos no filtro (${aq} de aquisição · ${rev} de revisita) · meta <b>${metaQ}q</b>
    · ~<b>${fmtMin(min)}</b> de questões · <b>${concl}</b> marcados concluídos
    <span class="muted">· régua: ${assSemBase==="orig"?"plano original":"replanejada"}</span>${nota}</div>`;
}

/* ============================================================
   DISCIPLINA — evolução no tempo (questões resolvidas e taxa de acerto),
   total, por matéria e por assunto. Fonte: state.sessions.
   ============================================================ */
let discFilt={mat:"",ass:"",gran:"dia"};
function sessKeyAssunto(s){ return s.topicId?("t"+s.topicId):("l"+(s.assuntoLivre||"—")); }
function sessNomeAssunto(s){ const t=s.topicId?topicById(s.topicId):null; return t?t.assunto:(s.assuntoLivre||"—"); }
function keyEnc(k){ return encodeURIComponent(k).replace(/'/g,"%27"); }
function discSetMat(v){ discFilt.mat=v; discFilt.ass=""; renderDisciplina(); }
function discSetAss(v){ const k=decodeURIComponent(v); discFilt.ass=(k&&discFilt.ass===k)?"":k; renderDisciplina(); }
function discSetGran(v){ discFilt.gran=v; renderDisciplina(); }

function serieTemporal(sess){ // agrega por dia ou semana -> [{per,qr,qa}] em ordem cronológica
  const porSem=discFilt.gran==="sem", m={};
  sess.forEach(s=>{
    const per=porSem?startOfWeek(new Date(s.data+"T12:00:00")).toISOString().slice(0,10):s.data;
    if(!m[per]) m[per]={qr:0,qa:0};
    m[per].qr+=s.qResolvidas||0; m[per].qa+=s.qAcertadas||0;
  });
  return Object.keys(m).sort().map(per=>({per,qr:m[per].qr,qa:m[per].qa}));
}
function tendencia(sess){ // 1ª metade vs 2ª metade das questões, em ordem cronológica
  const recs=[...sess].sort((a,b)=>a.data.localeCompare(b.data)||a.id-b.id);
  const tot=recs.reduce((a,s)=>a+(s.qResolvidas||0),0);
  if(tot<8) return null; // amostra pequena demais para tendência
  let acc=0; const h1={qr:0,qa:0}, h2={qr:0,qa:0};
  recs.forEach(s=>{ const h=acc<tot/2?h1:h2; h.qr+=s.qResolvidas||0; h.qa+=s.qAcertadas||0; acc+=s.qResolvidas||0; });
  if(!h1.qr||!h2.qr) return null;
  const p1=pct(h1.qa,h1.qr), p2=pct(h2.qa,h2.qr);
  return {d:p2-p1,p1,p2};
}
function tendTag(t){
  if(!t) return '<span class="muted" style="font-size:12px">amostra pequena</span>';
  const cor=t.d>=3?"var(--ok)":t.d<=-3?"var(--bad)":"var(--muted)";
  const sym=t.d>=3?"▲":t.d<=-3?"▼":"▬";
  return `<span style="color:${cor};font-weight:600">${sym} ${t.d>0?"+":""}${t.d}pp</span> <span class="muted" style="font-size:11.5px">${t.p1}%→${t.p2}%</span>`;
}
function sparkline(serie){ // mini-gráfico da % de acerto por período
  if(serie.length<2) return '<span class="muted">—</span>';
  const W=110,H=26,p=4;
  const xy=serie.map((s,i)=>[p+(W-2*p)*i/(serie.length-1), p+(H-2*p)*(1-pct(s.qa,s.qr)/100)]);
  const last=pct(serie[serie.length-1].qa,serie[serie.length-1].qr);
  const cor=last>=70?"var(--ok)":last>=50?"var(--warn)":"var(--bad)";
  return `<svg width="${W}" height="${H}" style="vertical-align:middle"><polyline points="${xy.map(c=>c.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${cor}" stroke-width="1.5"/><circle cx="${xy[xy.length-1][0].toFixed(1)}" cy="${xy[xy.length-1][1].toFixed(1)}" r="2.5" fill="${cor}"/></svg>`;
}
function chartEvolucao(serie){
  if(!serie.length) return `<div class="empty">Nenhuma questão registrada com esses filtros. Registre na aba <b>Sessão de Estudo</b>.</div>`;
  const n=serie.length,W=Math.max(620,n*56+96),H=252,pL=42,pR=46,pT=20,pB=34;
  const iw=W-pL-pR,ih=H-pT-pB;
  const maxQ=Math.max(...serie.map(p=>p.qr),1);
  const x=i=>pL+iw*((i+0.5)/n), yQ=v=>pT+ih-(v/maxQ)*ih, yP=v=>pT+ih-(v/100)*ih;
  const bw=Math.min(30,(iw/n)*0.5);
  let aq=0,aa=0; const cum=serie.map(p=>{aq+=p.qr;aa+=p.qa;return pct(aa,aq);});
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.min(W,860)}px;display:block">`;
  [0,25,50,75,100].forEach(v=>{ g+=`<line x1="${pL}" x2="${W-pR}" y1="${yP(v)}" y2="${yP(v)}" stroke="var(--line)" stroke-width="1"${v?' stroke-dasharray="3 4"':''}/><text x="${W-pR+6}" y="${yP(v)+3.5}" fill="var(--muted)" font-size="10">${v}%</text>`; });
  g+=`<text x="${pL-6}" y="${yQ(maxQ)+4}" fill="var(--muted)" font-size="10" text-anchor="end">${maxQ}q</text><text x="${pL-6}" y="${pT+ih+4}" fill="var(--muted)" font-size="10" text-anchor="end">0</text>`;
  serie.forEach((p,i)=>{
    g+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${yQ(p.qr).toFixed(1)}" width="${bw.toFixed(1)}" height="${(pT+ih-yQ(p.qr)).toFixed(1)}" rx="3" fill="#4cc2ff44"/>`;
    g+=`<text x="${x(i).toFixed(1)}" y="${(yQ(p.qr)-4).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="middle">${p.qr}</text>`;
    if(n<=24||i%Math.ceil(n/24)===0) g+=`<text x="${x(i).toFixed(1)}" y="${H-8}" fill="var(--muted)" font-size="10" text-anchor="middle">${fmtData(p.per)}</text>`;
  });
  g+=`<polyline points="${serie.map((p,i)=>x(i).toFixed(1)+","+yP(cum[i]).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="5 4" opacity=".9"/>`;
  g+=`<polyline points="${serie.map((p,i)=>x(i).toFixed(1)+","+yP(pct(p.qa,p.qr)).toFixed(1)).join(" ")}" fill="none" stroke="var(--ok)" stroke-width="2"/>`;
  serie.forEach((p,i)=>{ const v=pct(p.qa,p.qr);
    g+=`<circle cx="${x(i).toFixed(1)}" cy="${yP(v).toFixed(1)}" r="3.5" fill="var(--ok)"/><text x="${x(i).toFixed(1)}" y="${(yP(v)-7).toFixed(1)}" fill="var(--ok)" font-size="10" font-weight="600" text-anchor="middle">${v}%</text>`; });
  g+=`</svg>`;
  return `<div style="overflow-x:auto">${g}</div>
  <div class="legend" style="margin:8px 0 0">
    <span><span class="dot" style="background:#4cc2ff77;border-radius:3px;width:12px"></span>questões resolvidas</span>
    <span><span class="dot" style="background:var(--ok)"></span>% acerto do período</span>
    <span><span style="border-top:2px dashed var(--accent2);width:16px;display:inline-block"></span>% acerto acumulado</span>
  </div>`;
}
/* Desempenho × Prioridade — cruza o desempenho real por assunto (DESEMP_TEC,
   todas as questões do TEC) com a prioridade curada (P1..P4). Objetivo: achar
   de relance os assuntos PRIORITÁRIOS ainda FRACOS (canto superior-esquerdo). */
const MIN_Q_PRIO=3; // ignora assuntos com pouquíssimo volume (ruído)
function assuntosPrioridade(filtGrupo){
  if(!DESEMP_TEC||!DESEMP_TEC.assuntos) return [];
  return DESEMP_TEC.assuntos.filter(a=>a.prio&&a.unicas>=MIN_Q_PRIO&&(!filtGrupo||a.grupo===filtGrupo));
}
/* Layout em beeswarm: cada bolha desce/sobe dentro da faixa da sua prioridade
   até achar espaço livre, e o RÓTULO do assunto entra na conta da colisão.
   O jitter antigo (3 posições fixas numa faixa de altura fixa) empilhava as
   47 bolhas de P1 umas sobre as outras; aqui nada se sobrepõe e a altura de
   cada faixa cresce conforme a lotação. O eixo x também dá zoom no intervalo
   realmente ocupado — com quase tudo entre 60% e 100%, a escala 0..100
   amontoava tudo no terço direito. */
function chartPrioridade(filtGrupo){
  const pts=assuntosPrioridade(filtGrupo);
  if(!DESEMP_TEC) return `<div class="empty">Rode <code>python 06_Scripts/desempenho_assuntos.py</code> e publique <code>Estudos/desempenho_assuntos.json</code> para ver o cruzamento desempenho × prioridade (via <code>file://</code> o fetch é bloqueado).</div>`;
  if(!pts.length) return `<div class="empty">Sem assuntos com ≥${MIN_Q_PRIO} questões e prioridade mapeada${filtGrupo?" nesta matéria":""}.</div>`;
  const REF=refMetrica();                  // limiar de reforço (P1-P2 abaixo disso = ⚠)
  const W=760,pL=36,pR=16,pT=16,pB=28, iw=W-pL-pR;
  const menor=Math.min(...pts.map(metrica));
  // em saldo o eixo pode ir a negativo; em acerto bruto o piso continua sendo 0
  const x0=Math.max(MODO_CE?-100:0,Math.min(60,Math.floor(menor/10)*10));  // 1º tique
  const d0=x0-3, d1=101.5;                                    // domínio c/ folga p/ o raio
  const xP=v=>pL+iw*(v-d0)/(d1-d0);
  const raio=a=>Math.max(3.5,Math.min(13,3+Math.sqrt(a.unicas)*1.4));
  const curto=a=>a.assunto.replace(/\s*\(.*$/,"").slice(0,26);

  // --- empacotamento por faixa: retângulo (bolha + rótulo) contra retângulo ---
  const faixas=[1,2,3,4].filter(p=>pts.some(a=>a.prio===p)).map(p=>{
    const postos=[];
    pts.filter(a=>a.prio===p).sort((a,b)=>metrica(a)-metrica(b)).forEach(a=>{
      const r=raio(a), cx=xP(metrica(a)), danger=p<=2&&metrica(a)<REF;
      const lw=danger?3+curto(a).length*5.2:0;
      // rótulo à ESQUERDA por padrão: o lado <70% é onde sobra espaço vazio e,
      // assim, ele não empurra o cluster denso da direita (gráfico ~25% mais baixo)
      const esq=danger&&cx-r-lw>pL+2;
      const w0=cx-r-(esq?lw:0)-1, w1=cx+r+(esq?0:lw)+1, hh=Math.max(r,danger?7:0)+1.5;
      let dy=0;                            // 0, +3, -3, +6, -6… até não colidir
      for(let k=0;k<400;k++){
        dy=k?(k%2?1:-1)*Math.ceil(k/2)*3:0;
        if(!postos.some(q=>w0<q.w1&&w1>q.w0&&Math.abs(dy-q.dy)<hh+q.hh)) break;
      }
      postos.push({a,r,cx,danger,esq,dy,w0,w1,hh});
    });
    const topo=Math.min(...postos.map(q=>q.dy-q.hh)), base=Math.max(...postos.map(q=>q.dy+q.hh));
    return {p,postos,alt:Math.max(40,base-topo+16),desl:8-topo};
  });
  let yy=pT; faixas.forEach(f=>{ f.y0=yy; f.eixo=yy+f.desl; yy+=f.alt; });
  const H=yy+pB, ih=yy-pT;

  // largura fixa de propósito: com width:100% o viewBox escalaria a altura junto
  // (609px viram ~880px num card largo) — aqui o gráfico fica no tamanho natural
  // e o container é que rola na horizontal em telas estreitas
  let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block">`;
  // zona de perigo: prioritário (P1-P2) + abaixo de 70%
  const fp=faixas.filter(f=>f.p<=2);
  if(fp.length&&xP(REF)>pL+4){
    const alt=fp.reduce((s,f)=>s+f.alt,0);
    g+=`<rect x="${pL}" y="${fp[0].y0}" width="${(xP(REF)-pL).toFixed(1)}" height="${alt}" fill="#f8514915"/>`;
    g+=`<text x="${pL+6}" y="${fp[0].y0+13}" fill="var(--bad)" font-size="10" font-weight="600">⚠ reforçar</text>`;
  }
  // grade vertical de 10 em 10, com o limiar de 70% destacado
  for(let v=x0;v<=100;v+=10){ const lim=v===REF, x=xP(v).toFixed(1);
    g+=`<line x1="${x}" x2="${x}" y1="${pT}" y2="${pT+ih}" stroke="${lim?'var(--bad)':'var(--line)'}" stroke-width="1" stroke-dasharray="3 4" opacity="${lim?.6:1}"/>`;
    g+=`<text x="${x}" y="${H-9}" fill="${lim?'var(--bad)':'var(--muted)'}" font-size="10" text-anchor="middle">${v}%</text>`;
  }
  // faixas de prioridade
  faixas.forEach((f,i)=>{
    g+=`<text x="${pL-8}" y="${(f.y0+f.alt/2+4).toFixed(1)}" fill="var(--muted)" font-size="11" font-weight="600" text-anchor="end">P${f.p}</text>`;
    if(i) g+=`<line x1="${pL}" x2="${W-pR}" y1="${f.y0}" y2="${f.y0}" stroke="var(--line)" stroke-width="1" opacity=".4"/>`;
  });
  // bolhas
  faixas.forEach(f=>f.postos.forEach(q=>{ const a=q.a, cy=f.eixo+q.dy;
    g+=`<circle cx="${q.cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${q.r.toFixed(1)}" fill="${matCor(a.grupo)}" fill-opacity="${q.danger?0.9:0.5}" stroke="${q.danger?'var(--bad)':'#0006'}" stroke-width="${q.danger?1.6:1}"><title>SEFAZ-AL · ${escapeHtml(a.assunto)} — ${rotMetrica()} ${metrica(a)}%${MODO_CE?` (${a.pct_unicas}% bruto)`:""} (${a.acertos_unicas}/${a.unicas}) · P${a.prio} · ${matNome(a.grupo)}</title></circle>`;

/* ============================================================
   REPLANEJAMENTO DINÂMICO — o cronograma segue a execução real.
   planExec(): consolida as sessões por assunto (questões, datas, dias).
   replanejar(): assuntos com meta cumprida ficam na semana em que foram
   concluídos; o que falta é realocado da semana atual em diante (nunca
   antes da semana original), empurrando para a frente quando a capacidade
   semanal da matéria (maior carga semanal do próprio plano) estoura.
   ============================================================ */
/* Execução por tópico. Fonte "Só TEC" (window.EXEC_TEC, gerado das capturas do
   TEC): fiel e sem lançamento manual. Fallback: sessões digitadas à mão. */
function planExec(){
  const manual=planExecManual();
  if(!(window.EXEC_TEC&&window.EXEC_TEC.por_topico)) return manual;
  // Fusão por TÓPICO: onde há captura do TEC ela manda (é fiel e deduplicada);
  // onde NÃO há, valem as sessões lançadas à mão. Antes o TEC zerava tudo que
  // ele não mapeava — assuntos estudados fora do TEC (ou com assunto ainda sem
  // topicId no desempenho_assuntos.py) apareciam com 0% de avanço no cronograma.
  const tec=planExecTEC();
  Object.keys(manual).forEach(k=>{ if(!tec[k]) tec[k]=manual[k]; });
  return tec;
}
function planExecManual(){
  const m={};
  [...state.sessions].sort((a,b)=>a.data.localeCompare(b.data)||(a.id||0)-(b.id||0)).forEach(s=>{
    if(!s.topicId) return; const k=String(s.topicId);
    if(!m[k]) m[k]={qr:0,qa:0,min:0,d0:null,d1:null,dMeta:null,dias:[]};
    const e=m[k];
    e.qr+=s.qResolvidas||0; e.qa+=s.qAcertadas||0; e.min+=s.minutos||0;
    if((s.minutos||0)>0||(s.qResolvidas||0)>0){
      if(!e.d0) e.d0=s.data; if(!e.d1||s.data>e.d1) e.d1=s.data;
      if(!e.dias.includes(s.data)) e.dias.push(s.data);
    }
    const meta=topicMeta(s.topicId);
    if(!e.dMeta&&meta>0&&e.qr>=meta) e.dMeta=s.data;
  });
  return m;
}
// Execução a partir do TEC (por questão única resolvida por tópico). qr/qa e datas
// vêm prontos do script; dMeta = 1º dia em que o acumulado alcançou a meta (calculado
// pela contagem por dia, que reflete tentativas — aproximação suficiente p/ semEff).
function planExecTEC(){
  const pt=window.EXEC_TEC.por_topico, pd=window.EXEC_TEC.por_dia||[];
  const m={};
  Object.keys(pt).forEach(k=>{ const e=pt[k];
    m[k]={qr:e.qr||0,qa:e.qa||0,min:0,d0:e.d0||null,d1:e.d1||null,dMeta:null,dias:(e.dias||[]).slice()};
  });
  // dMeta: varre os dias em ordem, acumulando tentativas até bater a meta do tópico.
  const acc={};
  [...pd].sort((a,b)=>String(a.data).localeCompare(String(b.data))).forEach(r=>{
    const k=String(r.id), e=m[k]; if(!e) return;
    acc[k]=(acc[k]||0)+(r.qr||0);
    const meta=topicMeta(r.id);
    if(!e.dMeta&&meta>0&&acc[k]>=meta) e.dMeta=r.data;
  });
  return m;
}
function replanejar(){
  const exec=planExec();
  const cwReal=semanaDoDia(new Date());
  const wNow=Math.min(ULT_SEMANA,Math.max(1,cwReal));
  const topics=SEED_TOPICS.filter(t=>topicMeta(t.id)>0&&topicSemana(t.id)>0);
  // capacidade semanal por matéria = maior carga semanal do plano original
  const load={};
  topics.forEach(t=>{ const g=grupo(t.mat), w=topicSemana(t.id);
    (load[g]=load[g]||{})[w]=(load[g][w]||0)+topicMeta(t.id); });
  const cap={}; Object.keys(load).forEach(g=>cap[g]=Math.max(...Object.values(load[g])));
  const info={}, uso={}, pend=[]; let overflow=0;
  topics.forEach(t=>{
    const e=exec[String(t.id)]||{qr:0,qa:0,min:0,dias:[]};
    const meta=topicMeta(t.id), semOrig=topicSemana(t.id);
    const resto=Math.max(0,meta-e.qr);
    const ok=resto===0||state.topicStatus[t.id]==="concluido";
    if(ok){
      const dRef=e.dMeta||e.d1;
      const semEff=dRef?Math.min(ULT_SEMANA,Math.max(1,semanaDoDia(new Date(dRef+"T12:00:00")))):semOrig;
      info[t.id]={t,semOrig,semEff,meta,qr:e.qr,qa:e.qa,resto:0,ok:true,movido:false,exec:e};
    } else pend.push({t,g:grupo(t.mat),semOrig,meta,resto,e});
  });
  pend.sort((a,b)=>a.semOrig-b.semOrig||prioSort(a.t,b.t));
  pend.forEach(p=>{
    let w=Math.max(wNow,Math.min(p.semOrig,ULT_SEMANA));
    while(w<ULT_SEMANA){
      const usado=(uso[p.g]&&uso[p.g][w])||0;
      if(usado===0||usado+p.resto<=cap[p.g]) break;
      w++;
    }
    (uso[p.g]=uso[p.g]||{})[w]=(((uso[p.g]||{})[w])||0)+p.resto;
    if(w>ULT_AQUISICAO && w>p.semOrig) overflow+=p.resto;
    info[p.t.id]={t:p.t,semOrig:p.semOrig,semEff:w,meta:p.meta,qr:p.e.qr,qa:p.e.qa,resto:p.resto,ok:false,movido:w>p.semOrig,exec:p.e};
  });
  return {info,cap,wNow,cwReal,overflow};
}

let cronoModo="efetivo"; // "efetivo" = replanejado conforme execução · "original" = plano fixo
function cronoModoSet(m){ cronoModo=m; renderCronograma(); }

function tabelaQuestoesSemana(hl,plano){
  const efet=cronoModo==="efetivo";
  const infos=Object.values(plano.info);
  let maxW=ULT_AQUISICAO;
  if(efet) infos.forEach(i=>{ if(!i.ok&&i.semEff>maxW) maxW=i.semEff; });
  const weeks=[]; for(let w=1;w<=maxW;w++) weeks.push(w);
  const mats=Object.keys(MAT_INFO).filter(g=>infos.some(i=>grupo(i.t.mat)===g));
  const cell={}, pendCell={}, totMat={}, totSem={}, timeSem={};
  mats.forEach(g=>{ cell[g]={}; pendCell[g]={}; totMat[g]=0; });
  infos.forEach(i=>{
    const g=grupo(i.t.mat), w=efet?i.semEff:i.semOrig, v=efet?(i.ok?i.meta:i.resto):i.meta;
    cell[g][w]=(cell[g][w]||0)+v; totMat[g]+=v; totSem[w]=(totSem[w]||0)+v;
    if(!i.ok) pendCell[g][w]=true;
  });
  weeks.forEach(w=>{ let min=0; mats.forEach(g=>{ min+=(cell[g][w]||0)/ritmo(g)*60; }); timeSem[w]=min; });
  const wc=w=>w===hl?" wk-now":"";
  let h=`<table><thead><tr><th>Matéria</th>`+weeks.map(w=>`<th class="right${wc(w)}">S${w}</th>`).join("")+`<th class="right">Total</th></tr></thead><tbody>`;
  mats.forEach(g=>{
    h+=`<tr><td><span class="dot" style="background:${MAT_INFO[g].cor}"></span> ${MAT_INFO[g].nome} <span class="qstat">(${RITMO[g]}q/h)</span></td>`;
    weeks.forEach(w=>{ const v=cell[g][w]||0;
      let s=v?String(v):'<span class="muted">·</span>';
      if(efet&&v&&!pendCell[g][w]) s=`<span style="color:var(--ok);font-weight:600">${v}✓</span>`;
      h+=`<td class="right${wc(w)}">${s}</td>`; });
    h+=`<td class="right"><b>${totMat[g]}</b></td></tr>`;
  });
  const totGeral=Object.values(totMat).reduce((a,b)=>a+b,0);
  h+=`<tr><td><b>Total questões</b></td>`+weeks.map(w=>`<td class="right${wc(w)}"><b>${totSem[w]||0}</b></td>`).join("")+`<td class="right"><b>${totGeral}</b></td></tr>`;
  h+=`<tr><td class="muted">Tempo só de questões</td>`+weeks.map(w=>`<td class="right muted${wc(w)}">${fmtMin(timeSem[w]||0)}</td>`).join("")+`<td class="right muted">—</td></tr>`;
  h+=`</tbody></table><div class="muted" style="font-size:12.5px;margin-top:8px">${efet
    ?`Modo <b>replanejado</b>: células <span style="color:var(--ok)">verdes ✓</span> = metas cumpridas (na semana em que foram concluídas); demais células = questões que <b>faltam</b>, realocadas da semana atual em diante conforme a capacidade semanal de cada matéria. Colunas S7/S8 só aparecem quando o backlog estoura a S6.`
    :`Plano original fixo. Alterne para “Replanejado” para ver o cronograma ajustado à execução real.`} O tempo acima é só resolução; o restante do bloco de 15h/sem é teoria, lei seca, Anki e refazer erros.</div>`;
  return h;
}

// Assuntos PENDENTES de uma matéria replanejados para a semana (P1 → P2…, ✅2025 primeiro).
function topicosSemana(matGroup, week, plano){
  return Object.values(plano.info)
    .filter(i=>!i.ok&&grupo(i.t.mat)===matGroup&&i.semEff===week)
    .sort((a,b)=>prioSort(a.t,b.t));
}
// Conteúdo (HTML) de um bloco da grade para a semana corrente.
function blocoConteudo(matGroup, week, plano, ids){
  if(matGroup==="CEX") return `<span class="bloco-note muted">Consolidação — sem assunto novo</span>`;
  // ids != null: o dia vem do PLANO_DIA e já diz quais assuntos são dele.
  const tops = ids ? ids.map(i=>plano.info[i]).filter(i=>i&&!i.ok)
                   : topicosSemana(matGroup, week, plano);

  }

  if(ritmo(matGroup)>=50) return `<span class="bloco-note">🎯 Sem pendências — simulado por bloco cronometrado (14 q) + refazer as erradas</span>`;
  return `<span class="bloco-note muted">Revisão / lei seca / Anki</span>`;

let cronoWeek=null; // null = segue a semana atual; nº = semana fixada pela navegação

      ?`<span style="color:var(--warn)"><b>${movP.length} re-agendados</b> (${movQ}q pendentes movidas p/ frente${plano.overflow?`; <b>${plano.overflow}q estourando p/ a Fase 3</b>`:""})</span>`
      :`<span style="color:var(--ok)">nenhum atraso — plano em dia</span>`}
    <span class="muted">· o que não é cumprido migra sozinho para as semanas seguintes — detalhe na aba <b>Gantt</b></span></div>`;

  html += `<h2 class="sec">🎯 Metas de questões por semana <span class="pill">${cronoModo==="efetivo"?"ajustado à execução real":"plano original fixo"}</span></h2>

/* ============================================================
   GANTT — previsto (plano original) × replanejado × realizado
   Linha do tempo diária de 25/06 a 21/08; um assunto por linha.
   ============================================================ */
const GANTT_DIAS=Math.round((new Date(PERIODO_FIM+"T12:00:00")-new Date(PERIODO_INI+"T12:00:00"))/86400000)+1;
function dayIdx(ds){
  const i=Math.round((new Date(ds+"T12:00:00")-new Date(PERIODO_INI+"T12:00:00"))/86400000);
  return Math.max(0,Math.min(GANTT_DIAS-1,i));
}
function gPos(d0,d1){ const a=dayIdx(d0), b=dayIdx(d1);
  return `left:${(a/GANTT_DIAS*100).toFixed(3)}%;width:${((b-a+1)/GANTT_DIAS*100).toFixed(3)}%`; }
function semDatas(w){ // [segunda, sexta] da semana w do ciclo
  const d=new Date(S1_SEGUNDA+"T12:00:00"); d.setDate(d.getDate()+(w-1)*7);
  const a=d.toISOString().slice(0,10); d.setDate(d.getDate()+4);
  return [a,d.toISOString().slice(0,10)];
}
let ganttFilt={mat:"",view:""}; // view: ""=todos | pend | mov | conc
function ganttSet(k,v){ ganttFilt[k]=v; renderGantt(); }
function renderGantt(){
  const plano=replanejar();
  const infos=Object.values(plano.info);
  const match=i=>{
    if(ganttFilt.mat&&grupo(i.t.mat)!==ganttFilt.mat) return false;
    if(ganttFilt.view==="pend") return !i.ok;
    if(ganttFilt.view==="mov") return !i.ok&&i.movido;
    if(ganttFilt.view==="conc") return i.ok;
    return true;
  };
  const mats=Object.keys(MAT_INFO).filter(g=>infos.some(i=>grupo(i.t.mat)===g));
  const concl=infos.filter(i=>i.ok).length, mov=infos.filter(i=>!i.ok&&i.movido).length;
  const hoje=todayStr();

  let html=`<div class="filters">
    <select onchange="ganttSet('mat',this.value)"><option value="">Todas as matérias</option>${mats.map(g=>`<option value="${g}" ${g===ganttFilt.mat?"selected":""}>${MAT_INFO[g].nome}</option>`).join("")}</select>
    <select onchange="ganttSet('view',this.value)">
      <option value="">Todos os assuntos</option>
      <option value="pend" ${ganttFilt.view==="pend"?"selected":""}>Só pendentes</option>
      <option value="mov" ${ganttFilt.view==="mov"?"selected":""}>Só re-agendados</option>
      <option value="conc" ${ganttFilt.view==="conc"?"selected":""}>Só concluídos</option>
    </select>
    <span class="qstat">${concl}/${infos.length} concluídos · ${mov} re-agendados${plano.overflow?` · ${plano.overflow}q estourando p/ S7–S8`:""}</span>
  </div>
  <div class="legend">
    <span><span style="width:18px;height:10px;border:1.5px dashed #8b9bb0;border-radius:3px;display:inline-block"></span> semana planejada (original)</span>
    <span><span style="width:18px;height:10px;background:#4cc2ff66;border-radius:3px;display:inline-block"></span> semana replanejada (pendente)</span>
    <span><span class="dot" style="background:var(--ok);border-radius:2px"></span> realizado — meta cumprida</span>
    <span><span class="dot" style="background:var(--warn);border-radius:2px"></span> realizado parcial</span>
    <span><span style="width:2px;height:12px;background:var(--bad);display:inline-block"></span> hoje</span>
  </div>
  <div class="card gantt-wrap"><div class="gantt">`;

  // overlay: separadores das semanas + linha de hoje (atravessam todas as linhas)
  let overlay="";
  for(let w=1;w<=8;w++){ const [a]=semDatas(w);
    overlay+=`<div class="g-sep" style="top:24px;bottom:0;left:calc(var(--glab) + (100% - var(--glab))*${(dayIdx(a)/GANTT_DIAS).toFixed(4)})"></div>`; }
  if(hoje>=PERIODO_INI&&hoje<=PERIODO_FIM)
    overlay+=`<div class="g-today" style="top:0;bottom:0;left:calc(var(--glab) + (100% - var(--glab))*${((dayIdx(hoje)+0.5)/GANTT_DIAS).toFixed(4)})" title="hoje"></div>`;

  // cabeçalho S1..S8
  html+=`<div class="g-row" style="min-height:24px"><div class="g-lab muted" style="font-size:11px">assunto · feitas/meta</div><div class="g-track">`;
  for(let w=1;w<=8;w++){ const [a,b]=semDatas(w);
    html+=`<div class="g-wlab" style="${gPos(a,b)};text-align:center" title="${fmtData(a)}–${fmtData(b)}">S${w}</div>`; }
  html+=`</div></div>`;

  let temLinha=false;
  mats.forEach(g=>{
    const items=infos.filter(i=>grupo(i.t.mat)===g&&match(i))
      .sort((a,b)=>a.semEff-b.semEff||prioSort(a.t,b.t));
    if(!items.length) return;
    temLinha=true;
    const doneG=infos.filter(i=>grupo(i.t.mat)===g&&i.ok).length, totG=infos.filter(i=>grupo(i.t.mat)===g).length;
    html+=`<div class="g-row ghead"><div class="g-lab"><span class="dot" style="background:${MAT_INFO[g].cor}"></span> <b>${MAT_INFO[g].nome}</b> <span class="q">${doneG}/${totG} concl.</span></div><div class="g-track"></div></div>`;
    items.forEach(i=>{
      const cor=MAT_INFO[g].cor;
      const st=i.ok
        ?`<span style="color:var(--ok)">${i.qr}/${i.meta}q ✓</span>`
        :`<span class="q">${i.qr}/${i.meta}q</span>${i.movido?` <span class="mov-chip">↪S${i.semOrig}→S${i.semEff}</span>`:""}`;
      html+=`<div class="g-row"><div class="g-lab" title="${escapeHtml(i.t.assunto)}"><span class="prio p${i.t.prio||3}" style="font-size:10px">${PRIO_LABEL[i.t.prio||3]}</span> ${i.t.c25?"✅ ":""}${escapeHtml(i.t.assunto)} ${st}</div><div class="g-track">`;
      const [p0,p1]=semDatas(Math.min(8,i.semOrig));
      html+=`<div class="g-bar g-plan" style="${gPos(p0,p1)}" title="planejado: S${i.semOrig} (${fmtData(p0)}–${fmtData(p1)})"></div>`;
      if(!i.ok){ const [e0,e1]=semDatas(i.semEff);
        html+=`<div class="g-bar g-eff" style="${gPos(e0,e1)};background:${cor}" title="replanejado: S${i.semEff} — faltam ${i.resto}q"></div>`; }
      const e=i.exec;
      if(e&&e.d0){
        const corR=i.ok?"var(--ok)":"var(--warn)";
        html+=`<div class="g-bar g-real" style="${gPos(e.d0,e.d1)};background:${corR}"></div>`;
        (e.dias||[]).forEach(ds=>html+=`<div class="g-dot" style="left:${(dayIdx(ds)/GANTT_DIAS*100).toFixed(3)}%;width:${(100/GANTT_DIAS).toFixed(3)}%;background:${corR}" title="sessão em ${fmtData(ds)}"></div>`);
      }
      html+=`</div></div>`;
    });
  });
  if(!temLinha) html+=`<div class="empty">Nenhum assunto com esses filtros.</div>`;
  html+=overlay+`</div></div>
  <div class="muted" style="font-size:12.5px;margin-top:10px">Somente assuntos com meta de questões no plano (os mantidos só via Anki ficam de fora). Barra tracejada = semana do plano original; barra colorida translúcida = para onde o pendente foi <b>replanejado</b> conforme a execução (o que não é feito anda para a frente, respeitando a capacidade semanal da matéria). Quadradinhos = dias com sessão registrada no assunto.</div>`;
  document.getElementById("tab-gantt").innerHTML=html;
}
